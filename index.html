<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>SurPoids Championship</title>
<meta name="theme-color" content="#0B0D10">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="SPC">
<!-- Manifeste et icône injectés au chargement (voir pwaSetup) ; sur GitHub Pages ils deviendront de vrais fichiers manifest.json et icon.png -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;700&family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Layout : appli mobile une colonne, barre d'onglets fixe en bas, écrans empilés. Look unique sombre « vestiaire », cartes à la FIFA. */
:root{
  --bg:#0B0D10; --panel:#14171C; --panel2:#1B1F25; --line:#2A2F36; --fg:#E9ECEF; --muted:#9AA1A9;
  --gold:#D9AE4A; --gold2:#F6DE96; --gold-ink:#2A1F05;
  --blue:#5DA9FF; --cyan:#4ECDC4; --orange:#FF9F43; --red:#FF6B6B; --yellow:#FFD93D; --green:#6BCB77; --violet:#B89CFF; --sky:#5EC2FF;
  --display:'Oswald',Impact,'Arial Narrow',sans-serif; --body:'Barlow','Segoe UI',Roboto,sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.4;-webkit-font-smoothing:antialiased}
*{box-sizing:border-box}
button,input,select{font:inherit}
button{cursor:pointer}
a{color:var(--gold)}
h1,h2,h3{margin:0;font-family:var(--display);font-weight:700;text-wrap:balance}
.eyebrow{font-family:var(--display);font-weight:500;font-size:12px;letter-spacing:2px;text-transform:uppercase;color:var(--gold)}
.muted{color:var(--muted)}
.num{font-variant-numeric:tabular-nums}
.app{max-width:480px;margin:0 auto;min-height:100%;display:flex;flex-direction:column}
.screen{padding:20px 16px 110px;display:flex;flex-direction:column;gap:14px}
.topbar{display:flex;align-items:flex-end;justify-content:space-between;gap:12px}
.brand{display:flex;align-items:center;gap:10px;padding:4px 0 0}
.brand img{height:46px;width:auto;display:block}
.brand .t{font-family:var(--display);font-size:12px;letter-spacing:2px;color:var(--muted);text-transform:uppercase}
.belt-panel{background:#141008;border:1px solid #5A4A1A;border-radius:16px;padding:12px;display:flex;gap:12px;align-items:center}
.belt-panel img{width:96px;height:auto;border-radius:10px;flex:none}
.trophy{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:10px;display:flex;gap:10px;align-items:center}
.trophy img{width:64px;height:auto;border-radius:8px;flex:none}
.belt-tag{display:inline-flex;align-items:center;gap:4px;font-size:10px;font-weight:700;padding:3px 7px;border-radius:999px;background:#D9AE4A;color:#2A1F05;letter-spacing:.5px}
.topbar h1{font-size:30px;line-height:1.05}
.banner{background:#2A2410;border:1px solid #5A4A1A;color:var(--gold2);border-radius:12px;padding:10px 12px;font-size:13px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:14px}
.row{display:flex;align-items:center;gap:10px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.btn{min-height:44px;padding:0 16px;border-radius:12px;border:1px solid var(--line);background:var(--panel2);color:var(--fg);font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn.primary{background:var(--gold);border-color:var(--gold);color:var(--gold-ink)}
.btn.ghost{background:transparent}
.btn.small{min-height:36px;padding:0 12px;font-size:13px}
.btn:focus-visible,input:focus-visible,select:focus-visible,a:focus-visible{outline:2px solid var(--sky);outline-offset:2px}
.chip{font-size:12px;font-weight:600;padding:6px 10px;border-radius:999px;background:var(--panel);border:1px solid var(--line);display:inline-flex;align-items:center;gap:6px}
.dot{width:6px;height:6px;border-radius:50%;display:inline-block}
label{display:flex;flex-direction:column;gap:5px;font-size:12px;color:var(--muted);font-weight:600}
input,select{min-height:44px;border-radius:10px;border:1px solid var(--line);background:var(--panel2);color:var(--fg);padding:0 12px;width:100%}
input[type=number]{font-variant-numeric:tabular-nums}
.field-row{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.goal-head{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);text-align:center;margin-top:6px}
.goal-row{display:grid;grid-template-columns:1fr 1fr 1fr;grid-template-areas:"l l l" "c s t";gap:4px 6px;align-items:center;padding:8px 0;border-bottom:1px solid #22262C}
.goal-row:last-child{border-bottom:0}
.goal-row .gl{grid-area:l;font-size:12px;color:#C3C8CE}
.goal-row .gcur{grid-area:c;text-align:center;font-weight:700;font-size:15px;color:#C3C8CE;min-height:44px;display:flex;align-items:center;justify-content:center;border:1px solid #2A2F36;border-radius:10px;background:#101318}
.goal-row .gsug{grid-area:s;min-height:44px;font-size:14px;font-weight:700;color:var(--gold2);background:rgba(217,174,74,.08);border:1px dashed var(--gold);border-radius:10px;padding:0 6px;cursor:pointer;font-family:inherit;font-variant-numeric:tabular-nums}
.goal-row .gsug.on{background:var(--gold);color:#14171C;border-style:solid}
.goal-row .gsug.none{color:var(--muted);border-color:#2A2F36;background:none;cursor:default}
.goal-row input{grid-area:t;text-align:center;font-weight:700;border-color:var(--gold);color:var(--gold2);padding:0 6px}
.goal-row input.auto{border-style:dashed;color:#C9B06E;background:rgba(217,174,74,.05)}
.field-row.three{grid-template-columns:repeat(3,minmax(0,1fr))}
.section-title{font-family:var(--display);font-size:13px;letter-spacing:1.5px;text-transform:uppercase;color:var(--muted);display:flex;align-items:center;gap:6px}
/* carte FIFA */
.card-wrap{display:flex;justify-content:center}
.card-outer{width:258px;height:424px;clip-path:polygon(0 7%,50% 0,100% 7%,100% 86%,50% 100%,0 86%);display:flex;align-items:center;justify-content:center}
.card{width:250px;height:416px;clip-path:polygon(0 7%,50% 0,100% 7%,100% 86%,50% 100%,0 86%);display:flex;flex-direction:column;align-items:center;padding:26px 22px 0}
.card .top{width:100%;display:flex;justify-content:space-between;align-items:flex-start}
.card .ovr{font-family:var(--display);font-weight:700;font-size:48px;line-height:1}
.card .tier{font-family:var(--display);font-size:12px;letter-spacing:1.5px;margin-top:4px;padding:3px 8px;border-radius:999px;background:rgba(0,0,0,.22);text-align:center}
.card .avatar{width:84px;height:84px;border-radius:50%;border:3px solid rgba(0,0,0,.25);display:flex;align-items:center;justify-content:center;font-family:var(--display);font-weight:700;font-size:34px}
.card .name{font-family:var(--display);font-weight:700;font-size:26px;letter-spacing:3px;margin-top:8px;text-transform:uppercase}
.card .rule{width:70%;height:1px;opacity:.35;margin:4px 0 6px;background:currentColor}
.card .attrs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));column-gap:14px;row-gap:5px;width:100%}
.attr{display:flex;gap:7px;align-items:center}
.attr .ic{width:22px;height:22px;border-radius:7px;background:rgba(0,0,0,.3);display:flex;align-items:center;justify-content:center;flex:none}
.attr .v{font-family:var(--display);font-weight:700;font-size:17px;min-width:24px}
.attr .c{font-family:var(--display);font-size:13px;letter-spacing:1px;opacity:.85}
/* mini carte */
.mini{display:flex;flex-direction:column;text-decoration:none;color:inherit;clip-path:polygon(0 7%,50% 0,100% 7%,100% 88%,50% 100%,0 88%);padding:4px;border:0;width:100%;text-align:center}
.mini .in{flex:1;width:100%;box-sizing:border-box}
.mini .in{clip-path:polygon(0 7%,50% 0,100% 7%,100% 88%,50% 100%,0 88%);padding:22px 14px 18px;display:flex;flex-direction:column;align-items:center;min-height:196px}
.mini .in .top{width:100%;display:flex;justify-content:space-between;align-items:center}
.mini .ovr{font-family:var(--display);font-weight:700;font-size:34px;line-height:1}
.mini .av{width:50px;height:50px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:var(--display);font-weight:700;font-size:18px}
.card .stars{font-size:13px;letter-spacing:1px;color:#F6DE96;text-shadow:0 0 6px rgba(0,0,0,.4);margin-top:2px}
.card .ttl{font-family:var(--display);font-size:11px;letter-spacing:1.5px;text-transform:uppercase;opacity:.9;margin-top:2px;padding:2px 10px;border-radius:999px;background:rgba(0,0,0,.22);white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:ellipsis}
.card .pins{display:flex;gap:6px;flex-wrap:nowrap;justify-content:center;margin-top:3px}
.card .devise{font-size:11.5px;font-style:italic;opacity:.88;margin-top:3px;white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:ellipsis;letter-spacing:.2px}
.card .eqr{width:26px;height:26px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center}
.card .ttl+.pins{margin-top:4px}
.card .avatar{position:relative}
.card .avatar .ring,.mini .av .ring{position:absolute;inset:-16px;width:calc(100% + 32px);height:calc(100% + 32px);pointer-events:none;overflow:visible;filter:drop-shadow(0 1px 2px rgba(0,0,0,.45))}
.mini .av .ring{inset:-10px;width:calc(100% + 20px);height:calc(100% + 20px)}
.ring-spin{animation:ringspin 9s linear infinite}.ring-breathe{animation:ringbreathe 2.2s ease-in-out infinite}.ring-flicker{animation:ringflicker 1.1s ease-in-out infinite alternate}
@keyframes ringspin{to{transform:rotate(360deg)}}@keyframes ringbreathe{50%{transform:scale(1.08)}}@keyframes ringflicker{0%{transform:scale(.97) rotate(-2deg);opacity:.85}100%{transform:scale(1.04) rotate(2deg);opacity:1}}
.card .medal{position:relative;display:inline-flex;align-items:center;justify-content:center;filter:drop-shadow(0 2px 3px rgba(0,0,0,.55))}
.card .medal svg{position:absolute;inset:0}
.card .medal .mi{position:relative;z-index:1;display:flex;filter:drop-shadow(0 0 3px rgba(0,0,0,.6))}
.card .medal.ms-ruban .mi{margin-top:-14px}.card .medal.ms-etoile .mi{margin-top:2px}.card .medal.ms-flamme .mi{margin-top:10px}.card .medal.ms-goutte .mi{margin-top:12px}.card .medal.ms-bouclier .mi{margin-top:-4px}
.card .medal.rar-legendaire{animation:medalglow 2.4s ease-in-out infinite}@keyframes medalglow{50%{filter:drop-shadow(0 0 8px rgba(255,255,255,.7))}}
.card .medals{display:flex;gap:10px;justify-content:center;align-items:center;margin-top:7px;min-height:58px}
.card .medal-one{display:inline-flex;align-items:center;gap:8px;margin-top:6px;padding:3px 12px 3px 4px;border-radius:999px;background:rgba(0,0,0,.28);font-size:11.5px;font-weight:600;letter-spacing:.3px}
.crown{position:absolute;left:50%;transform:translateX(-50%);top:-22px;filter:drop-shadow(0 2px 2px rgba(0,0,0,.4))}
.mini .av .crown{top:-15px}
.holo{background-size:300% 100%,auto;animation:holo 3.2s linear infinite}
@keyframes holo{0%{background-position:150% 0,0 0}100%{background-position:-150% 0,0 0}}
.mini .stars-s{color:#F6DE96;letter-spacing:1px}
.mini .ttl-s{font-family:var(--display);font-size:10px;letter-spacing:1.5px;text-transform:uppercase;opacity:.85;margin-top:2px;white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:ellipsis}
.mini .pins-s{display:flex;gap:4px;justify-content:center;margin-top:4px;max-width:100%}
.mini .eqb-s{display:inline-flex;align-items:center;gap:4px;font-size:10px;font-weight:600;padding:2px 7px;border-radius:999px;white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:ellipsis}
.mini .eqr-s{width:20px;height:20px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center}
.mini .eqn{position:absolute;left:-6px;bottom:-4px;font-size:9px;font-weight:700;background:rgba(0,0,0,.55);color:#fff;border-radius:999px;padding:1px 5px}
.reveal-argent .card-outer{animation:glowA 1.4s ease-in-out 2}
.reveal-or .card-outer{animation:glowO 1.4s ease-in-out 2}
.reveal-diamant .card-outer{animation:glowD 1.2s ease-in-out 3}
.reveal-legende .card-outer{animation:hue 2.4s linear 2}
@keyframes glowA{50%{filter:drop-shadow(0 0 22px #F2F4F6)}}
@keyframes glowO{50%{filter:drop-shadow(0 0 28px #F6DE96)}}
@keyframes glowD{50%{filter:drop-shadow(0 0 30px #7FE3FF) brightness(1.15)}}
@keyframes hue{0%{filter:hue-rotate(0) drop-shadow(0 0 20px #B89CFF)}100%{filter:hue-rotate(360deg) drop-shadow(0 0 20px #B89CFF)}}
.card-outer{position:relative;overflow:hidden}
.card-outer>.card{position:relative;z-index:1}
.fx-spin{position:relative;overflow:hidden}
.fx-spin::before{content:'';position:absolute;left:50%;top:50%;width:220%;height:220%;transform:translate(-50%,-50%);background:var(--spin);animation:spin 5s linear infinite;z-index:0}
.mini.fx-spin>.in{position:relative;z-index:1}
@keyframes spin{to{transform:translate(-50%,-50%) rotate(360deg)}}
.card,.mini .in{position:relative;overflow:hidden;isolation:isolate}
.mini .av,.card .avatar{isolation:auto}
.fx-flames::after{content:'';position:absolute;left:-5%;right:-5%;bottom:0;height:46%;pointer-events:none;background:radial-gradient(45% 70% at 15% 100%,rgba(255,217,61,.8),transparent 70%),radial-gradient(50% 85% at 50% 100%,rgba(255,107,107,.85),transparent 70%),radial-gradient(45% 75% at 85% 100%,rgba(255,159,67,.8),transparent 70%);animation:flames 1.1s ease-in-out infinite alternate;mix-blend-mode:screen;transform-origin:50% 100%}
@keyframes flames{0%{transform:scaleY(.85) scaleX(1.03);filter:blur(1.5px)}100%{transform:scaleY(1.05) scaleX(.98);filter:blur(0)}}
.av-pulse{animation:pulse 1.4s ease-in-out infinite}
.av-halo{animation:halo 2.2s ease-in-out infinite}
@keyframes halo{50%{box-shadow:0 0 0 4px #FFFFFF,0 0 40px 14px #F6DE96}}
@keyframes pulse{50%{box-shadow:0 0 0 3px var(--fx1,#5EC2FF),0 0 34px 10px var(--fx2,#5DA9FF)}}
.av-sparkle::after{content:'';position:absolute;inset:-14px;border-radius:50%;pointer-events:none;background:radial-gradient(circle at 10% 20%,#fff 0 2px,transparent 3px),radial-gradient(circle at 85% 15%,#F6DE96 0 2px,transparent 3px),radial-gradient(circle at 90% 75%,#fff 0 1.5px,transparent 2.5px),radial-gradient(circle at 15% 80%,#F6DE96 0 2px,transparent 3px),radial-gradient(circle at 50% -2%,#fff 0 1.5px,transparent 2.5px),radial-gradient(circle at 60% 100%,#F6DE96 0 1.5px,transparent 2.5px);animation:twinkle 1.6s ease-in-out infinite}
@keyframes twinkle{0%,100%{opacity:.25;transform:scale(.92) rotate(0)}50%{opacity:1;transform:scale(1.06) rotate(8deg)}}
.av-avflames::before{content:'';position:absolute;left:-12%;right:-12%;bottom:-16%;height:75%;border-radius:50% 50% 40% 40%;pointer-events:none;z-index:-1;background:radial-gradient(40% 90% at 20% 100%,#FFD93D,transparent 70%),radial-gradient(45% 100% at 50% 100%,#FF6B6B,transparent 70%),radial-gradient(40% 90% at 80% 100%,#FF9F43,transparent 70%);animation:flames .9s ease-in-out infinite alternate;transform-origin:50% 100%}
.fx-shimmer{background-size:300% 100%!important;animation:shimmer 2.4s linear infinite}
@keyframes shimmer{to{background-position:-300% 0}}
.fx-glow{animation:glowOut 1.6s ease-in-out infinite}
@keyframes glowOut{50%{filter:drop-shadow(0 0 18px #F6DE96)}}
.av-pulse{--fx1:#5EC2FF;--fx2:#5DA9FF}
.av-smoke::before{content:'';position:absolute;left:-20%;right:-20%;top:-40%;height:120%;border-radius:50%;pointer-events:none;z-index:-1;background:radial-gradient(45% 55% at 35% 60%,rgba(200,205,212,.55),transparent 70%),radial-gradient(40% 50% at 65% 40%,rgba(200,205,212,.45),transparent 70%);filter:blur(4px);animation:smoke 3s ease-in-out infinite alternate}
@keyframes smoke{0%{transform:translateY(6%) scale(.95);opacity:.6}100%{transform:translateY(-10%) scale(1.08);opacity:1}}
.av-orbit::after{content:'';position:absolute;inset:-12px;border-radius:50%;pointer-events:none;background:radial-gradient(circle at 50% 0,#FFFFFF 0 3px,transparent 4px),radial-gradient(circle at 100% 50%,#7FE3FF 0 3px,transparent 4px),radial-gradient(circle at 50% 100%,#FFFFFF 0 3px,transparent 4px),radial-gradient(circle at 0 50%,#7FE3FF 0 3px,transparent 4px),radial-gradient(circle at 15% 15%,#7FE3FF 0 2px,transparent 3px),radial-gradient(circle at 85% 85%,#7FE3FF 0 2px,transparent 3px);animation:orbit 4s linear infinite}
@keyframes orbit{to{transform:rotate(360deg)}}
.av-wings::before,.av-wings::after{content:'';position:absolute;top:10%;width:70%;height:80%;pointer-events:none;z-index:-1;background:radial-gradient(60% 50% at 100% 60%,rgba(255,255,255,.95),rgba(255,255,255,.35) 60%,transparent 75%);filter:blur(.5px);animation:wing 1.3s ease-in-out infinite alternate}
.av-wings::before{right:88%;transform-origin:100% 60%}
.av-wings::after{left:88%;transform:scaleX(-1);transform-origin:0 60%;animation-name:wingR}
@keyframes wing{to{transform:rotate(-10deg) translateY(-6%)}}
@keyframes wingR{to{transform:scaleX(-1) rotate(-10deg) translateY(-6%)}}
.fx-embers::after{content:'';position:absolute;inset:0;pointer-events:none;background:radial-gradient(circle,#FFD93D 0 2px,transparent 3px) 10% 100%/40px 60px,radial-gradient(circle,#FF9F43 0 1.5px,transparent 2.5px) 60% 100%/55px 70px,radial-gradient(circle,#FF6B6B 0 2px,transparent 3px) 35% 100%/70px 90px;animation:embers 2.6s linear infinite;opacity:.9}
@keyframes embers{to{background-position:10% -60px,60% -70px,35% -90px}}
.fx-rain::after{content:'';position:absolute;inset:0;pointer-events:none;background:radial-gradient(circle,#F6DE96 0 2px,transparent 3px) 0 0/34px 44px,radial-gradient(circle,#FFFFFF 0 1.5px,transparent 2.5px) 17px 22px/34px 44px;animation:rain 1.4s linear infinite;opacity:.9}
@keyframes rain{to{background-position:0 44px,17px 66px}}
.fx-storm::after{content:'';position:absolute;inset:0;pointer-events:none;background:linear-gradient(180deg,rgba(255,255,255,.75),rgba(94,194,255,.35) 40%,transparent 70%);opacity:0;animation:storm 3.4s ease-in-out infinite}
@keyframes storm{0%,84%,100%{opacity:0}86%{opacity:.9}88%{opacity:.1}91%{opacity:.7}94%{opacity:0}}
.fx-smokebg::after{content:'';position:absolute;inset:-20%;pointer-events:none;background:radial-gradient(ellipse at 30% 70%,rgba(255,255,255,.22),transparent 55%),radial-gradient(ellipse at 70% 30%,rgba(255,255,255,.18),transparent 50%);filter:blur(6px);animation:smokebg 6s ease-in-out infinite alternate}
@keyframes smokebg{to{transform:translate(6%,-6%) scale(1.1)}}
.blinkcard{animation:blink 1.6s steps(1,end) infinite}
@keyframes blink{0%,55%{opacity:1}56%,100%{opacity:0}}
.blink-sw{animation:blinkSw 1.6s steps(1,end) infinite}
@keyframes blinkSw{0%,55%{opacity:1}56%,100%{opacity:.25}}
.panel,.belt-panel,.trophy{position:relative}
.hq{position:absolute;top:8px;right:8px;width:24px;height:24px;border-radius:50%;border:1px solid var(--line);background:var(--panel2);color:var(--muted);font-family:var(--display);font-size:14px;font-weight:700;display:flex;align-items:center;justify-content:center;z-index:2;cursor:pointer;line-height:1}
.has-hq>.section-title,.has-hq>.row:first-child{padding-right:30px}
.has-hq>.eyebrow{padding-right:26px}
.trophy.has-hq>div>.eyebrow{padding-right:18px}
.has-hq>.row:first-child .section-title{padding-right:0}
.trophy .hq{top:6px;right:6px;width:20px;height:20px;font-size:12px}
#pagehelp{position:fixed;top:12px;right:12px;z-index:30;width:40px;height:40px;border-radius:50%;border:2px solid var(--gold2);background:var(--gold);color:#14171C;font-family:var(--display);font-size:24px;font-weight:700;display:none;align-items:center;justify-content:center;box-shadow:0 4px 14px rgba(0,0,0,.45);cursor:pointer;padding:0}
.help p{margin:0 0 8px}.help p:last-child{margin:0}
.confetti{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.confetti i{position:absolute;top:-16px;width:8px;height:14px;border-radius:2px;opacity:.95;animation:fall 2.8s cubic-bezier(.3,.6,.6,1) forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg);opacity:.5}}
.rar-commun{color:#C3C8CE}
.rar-rare{color:#5DA9FF;font-weight:600}
.rar-epique{color:#B89CFF;font-family:var(--display);text-transform:uppercase;letter-spacing:1px;font-weight:500}
.rar-legendaire{font-family:var(--display);text-transform:uppercase;letter-spacing:1px;font-weight:700;background:linear-gradient(90deg,#B8892B,#F6DE96,#FFFFFF,#F6DE96,#B8892B);background-size:200% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shine 2.5s linear infinite}
@keyframes shine{to{background-position:200% 0}}
.rar-tag{font-size:10px;letter-spacing:.1em;text-transform:uppercase;padding:2px 6px;border-radius:999px;border:1px solid currentColor;margin-left:6px;vertical-align:middle;font-family:var(--body);font-weight:600;-webkit-text-fill-color:currentColor}
@media (prefers-reduced-motion:reduce){.blinkcard,.blink-sw,.fx-spin::before,.fx-flames::after,.fx-shimmer,.fx-glow,.fx-embers::after,.fx-rain::after,.fx-storm::after,.fx-smokebg::after,.av-pulse,.av-halo,.av-smoke::before,.av-orbit::after,.av-wings::before,.av-wings::after,.av-sparkle::after,.av-avflames::before,.holo,.rar-legendaire,.confetti i{animation:none}}
.cos-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.cos-grid button{min-height:70px;border-radius:12px;border:1px solid var(--line);background:var(--panel);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;font-size:10px;color:var(--muted);padding:6px 4px;text-align:center;line-height:1.1}
.cos-grid button.on{border-color:var(--gold);color:var(--gold2);background:rgba(217,174,74,.08)}
.cos-grid button.lk{opacity:.45}
.cos-sw{width:30px;height:30px;border-radius:9px;border:2px solid rgba(255,255,255,.15)}
.mini .eqi{position:absolute;right:-6px;bottom:-4px;width:22px;height:22px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#14171C;border:2px solid rgba(0,0,0,.35)}
.card .eqb{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:600;padding:3px 9px;border-radius:999px;margin-top:4px}
.skin-row{display:flex;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid #22262C}
.skin-row:last-child{border-bottom:0}
.skin-sw{width:44px;height:44px;border-radius:12px;flex:none;border:3px solid;display:flex;align-items:center;justify-content:center;font-family:var(--display);font-weight:700}
.eq-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.avstrip{display:flex;gap:6px;overflow-x:auto;padding:2px 44px 4px 0;scrollbar-width:none}.avstrip::-webkit-scrollbar{display:none}.avstrip button{flex:none;display:flex;flex-direction:column;align-items:center;gap:3px;background:none;border:0;color:var(--muted);font:inherit;font-size:10px;cursor:pointer;padding:2px 4px;min-width:52px}.avstrip .av{width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:var(--display);font-weight:700;font-size:14px;border:2px solid transparent;box-shadow:0 0 0 2px var(--line)}.avstrip button.on .av{box-shadow:0 0 0 2px var(--gold)}.avstrip button.on{color:var(--gold2)}
.feed-open{flex:1;display:flex;align-items:center;gap:6px;background:none;border:0;color:inherit;font:inherit;text-align:left;padding:0;cursor:pointer;min-height:28px}.feed-open>span:first-child{flex:1}.feed-open:hover{color:var(--gold2)}
.newtag{display:inline-block;font-family:var(--display);font-size:10px;letter-spacing:1.5px;text-transform:uppercase;padding:2px 7px;border-radius:999px;background:var(--gold);color:#14171C;margin-left:6px;vertical-align:middle;animation:blinkSw 1.2s steps(1,end) infinite}
.newdot{position:absolute;top:4px;right:4px;width:10px;height:10px;border-radius:50%;background:var(--gold);box-shadow:0 0 0 2px #14171C;animation:pulseDot 1.2s ease-in-out infinite}
@keyframes pulseDot{50%{transform:scale(1.5);box-shadow:0 0 0 2px #14171C,0 0 10px 3px rgba(217,174,74,.7)}}
.cos-grid button,.eq-grid button,.nav button{position:relative}
.navdot{position:absolute;top:4px;right:calc(50% - 26px);min-width:18px;height:18px;padding:0 5px;border-radius:999px;background:var(--red);color:#fff;font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;line-height:1;animation:blinkSw 1.2s steps(1,end) infinite}
.home-card{cursor:pointer}.cbtn{display:inline-flex;align-items:center;gap:4px;min-height:28px;padding:0 9px;border-radius:999px;border:1px solid var(--line);background:transparent;color:var(--muted);font:inherit;font-size:12px;cursor:pointer;margin-left:auto}.cbtn small{font-size:9px;opacity:.8}.cbtn.unread{border-color:var(--red);color:var(--fg)}.cbtn .cdot{display:inline-flex;align-items:center;justify-content:center;min-width:16px;height:16px;padding:0 4px;border-radius:999px;background:var(--red);color:#fff;font-size:10px;font-weight:700;animation:blinkSw 1.2s steps(1,end) infinite}
.panel.alert{border-color:var(--red);background:rgba(255,107,107,.08);color:var(--fg);font:inherit}
.alertdot{position:absolute;top:6px;right:6px;z-index:3;min-width:22px;height:22px;padding:0 6px;border-radius:999px;background:var(--red);color:#fff;font-family:var(--display);font-weight:700;font-size:13px;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 6px rgba(0,0,0,.5);animation:blinkSw 1.2s steps(1,end) infinite}.home-card{position:relative}.cbtn:hover{border-color:var(--gold);color:var(--gold2)}.home-cap{display:flex;justify-content:center;align-items:center;gap:8px;flex-wrap:wrap;font-size:13px;margin-top:4px}
.pips{display:flex;gap:3px;flex-shrink:0}.pips i{width:9px;height:9px;border-radius:50%;border:1.5px solid;display:block}
.eq-grid button{min-height:64px;border-radius:12px;border:1px solid var(--line);background:var(--panel);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:10px;color:var(--muted);padding:6px 4px;text-align:center;line-height:1.1}
.eq-grid button.on{border-color:var(--gold);color:var(--gold2);background:rgba(217,174,74,.08)}
.mini .nm{font-family:var(--display);font-weight:700;font-size:17px;letter-spacing:2px;margin-top:10px;text-transform:uppercase}
.mini .tr{font-family:var(--display);font-size:11px;letter-spacing:1.5px;opacity:.8}
.mini .rl{width:70%;height:1px;background:currentColor;opacity:.3;margin:8px 0}
.mini .st{font-size:13px;font-weight:600}
.mini .dl{font-size:12px;font-weight:600;margin-top:6px;padding:3px 8px;border-radius:999px;background:rgba(0,0,0,.18)}
/* tuiles stats */
.tile{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:10px 10px 9px;display:flex;flex-direction:column;gap:6px;color:inherit;text-align:left;font:inherit;width:100%}
button.tile{cursor:pointer}
button.zone-row{background:transparent;border:0;border-bottom:1px solid #22272E;color:inherit;width:100%;text-align:left;font:inherit;cursor:pointer;min-height:36px}
.stat-hero{display:flex;align-items:flex-end;justify-content:space-between;gap:12px}
.stat-hero .big{font-family:var(--display);font-size:52px;font-weight:700;line-height:1}
.tile .h{display:flex;align-items:center;justify-content:space-between}
.tile .ic{width:24px;height:24px;border-radius:8px;display:flex;align-items:center;justify-content:center}
.tile .tag{font-size:10px;font-weight:600}
.tile .v{font-family:var(--display);font-size:20px;font-weight:700;line-height:1}
.tile .l{font-size:11px;color:var(--muted)}
/* zones */
.zone-row{display:flex;align-items:center;gap:8px;font-size:12.5px;padding:4px 0;border-bottom:1px solid #22272E}
.zone-row .sw{width:8px;height:8px;border-radius:2px;flex:none}
/* nav */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:20;background:#0F1114;border-top:1px solid #22272E;padding:10px 12px calc(10px + env(safe-area-inset-bottom,0px))}
.nav .in{max-width:480px;margin:0 auto;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:4px}
.nav button{background:transparent;border:1px solid transparent;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:4px;padding:7px 0;font-size:11px;min-height:44px;border-radius:14px}
.nav button[aria-current=page]{color:var(--gold2);font-weight:600;border-color:rgba(217,174,74,.55);background:rgba(217,174,74,.14)}
/* classement */
.podium{display:flex;align-items:flex-end;justify-content:center;gap:10px}
.pod{display:flex;flex-direction:column;align-items:center;gap:6px;width:96px}
.pod .av{width:48px;height:48px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:var(--display);font-weight:700}
.pod .bar{width:100%;border-radius:10px 10px 0 0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.pod .bar .p{font-family:var(--display);font-size:22px;font-weight:700;line-height:1}
.rank-row{display:flex;align-items:center;gap:12px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 12px;min-height:44px;width:100%;text-align:left;color:inherit}
.rank-row .r{font-family:var(--display);font-size:16px;font-weight:700;color:var(--muted);width:22px}
.rank-row .av{width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:var(--display);font-weight:700;font-size:13px}
.rank-row .pts{font-family:var(--display);font-size:18px;font-weight:700}
.tabs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:4px}
.tabs button{min-height:40px;border:0;border-radius:9px;background:transparent;color:var(--muted);font-weight:600;font-size:13px}
.tabs button[aria-pressed=true]{background:var(--gold);color:var(--gold-ink)}
/* badges */
.badge{display:flex;gap:12px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px}
.badge .ic{width:44px;height:44px;border-radius:12px;display:flex;align-items:center;justify-content:center;flex:none}
.badge.locked{opacity:.55}
/* overlay révélation */
.overlay{position:fixed;inset:0;background:rgba(5,6,8,.92);display:flex;align-items:center;justify-content:center;z-index:50;padding:16px}
.overlay .box{display:flex;flex-direction:column;align-items:center;gap:16px;text-align:center}
@keyframes pop{0%{transform:scale(.4) rotateY(90deg);opacity:0}60%{transform:scale(1.06) rotateY(0);opacity:1}100%{transform:scale(1)}}
.reveal{animation:pop .9s cubic-bezier(.2,.8,.2,1)}
@media (prefers-reduced-motion:reduce){.reveal{animation:none}}
.chart{width:100%;height:auto;display:block}
.legend{display:flex;flex-wrap:wrap;gap:10px;font-size:12px}
.sheet{position:fixed;inset:0;z-index:45;background:rgba(5,6,8,.6);display:flex;align-items:flex-end;justify-content:center}
.sheet .sh{width:100%;max-width:480px;background:var(--panel);border:1px solid var(--line);border-radius:18px 18px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px));animation:up .22s ease-out}
@keyframes up{from{transform:translateY(30px);opacity:0}to{transform:none;opacity:1}}
.card .attr.tap,.card .eqb.tap,.card .eqr.tap{cursor:pointer}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(96px + env(safe-area-inset-bottom,0px));background:var(--panel2);border:1px solid var(--line);padding:10px 14px;border-radius:12px;font-size:13px;z-index:40}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
</style>
</head>

async function cloudSave(){
  if(CLOUD.saving){ CLOUD.saveTimer=setTimeout(()=>{CLOUD.saveTimer=null;cloudSave();},400); return; } CLOUD.saving=true;
  const sb=CLOUD.sb, snap=CLOUD.snap, admin=isAdmin(); const errs=[];
  const run=async(label,pr)=>{ const r=await pr; if(r&&r.error){ errs.push(label+' : '+r.error.message); return false; } return true; };
  try{
    // 1. participants
    for(const p of DB.profiles){ const row=profileRow(p); const j=JSON.stringify(row); if(snap.profiles[p.id]===j) continue; if(p.id!==ME&&!admin){ continue; }
      const exists=p.id in snap.profiles; const req=exists?sb.from('participants').update(row).eq('id',p.id):sb.from('participants').insert(row);
      if(await run('profil '+p.prenom, req)) snap.profiles[p.id]=j; }
    for(const id of Object.keys(snap.profiles)) if(!DB.profiles.find(p=>p.id===id)){ if(admin&&await run('suppression profil', sb.from('participants').delete().eq('id',id))) delete snap.profiles[id]; }
    // 2. pesées (photos envoyées dans le bucket)
    for(const w of DB.weighins){ if(w.photos){ for(const k of Object.keys(w.photos)){ const v=w.photos[k]; if(typeof v==='string'&&v.startsWith('data:')){ const path=w.id+'/'+k+'.jpg'; const up=await sb.storage.from('photos').upload(path,await dataUrlBlob(v),{upsert:true,contentType:'image/jpeg'}); if(up.error){ errs.push('photo '+k+' : '+up.error.message); continue; } (CLOUD.paths[w.id]=CLOUD.paths[w.id]||{})[k]=path; const su=await sb.storage.from('photos').createSignedUrl(path,86400); if(su.data) w.photos[k]=su.data.signedUrl; } else if(!v){ delete w.photos[k]; if(CLOUD.paths[w.id]) delete CLOUD.paths[w.id][k]; } } }
      else if(CLOUD.paths[w.id]) CLOUD.paths[w.id]={};
      const row=peseeRow(w); const j=JSON.stringify(row); if(snap.weighins[w.id]===j) continue; if(!admin) continue;
      if(await run('pesée '+w.id, sb.from('pesees').upsert(row,{onConflict:'id'}))) snap.weighins[w.id]=j; }
    for(const id of Object.keys(snap.weighins)) if(!DB.weighins.find(w=>w.id===id)){ if(admin&&await run('suppression pesée', sb.from('pesees').delete().eq('id',id))) delete snap.weighins[id]; }
    // 3. badges acquis
    const add=[]; for(const pid of Object.keys(DB.badgeLog||{})) for(const b of Object.keys(DB.badgeLog[pid])){ const k=pid+'|'+b; if(!snap.badges.has(k)&&(pid===ME||admin)) add.push({participant:pid,badge:b,mois:DB.badgeLog[pid][b]||null}); }
    if(add.length&&await run('badges', sb.from('badges_acquis').upsert(add,{onConflict:'participant,badge'}))) for(const a of add) snap.badges.add(a.participant+'|'+a.badge);
    for(const k of [...snap.badges]){ const [pid,b]=k.split('|'); if(DB.badgeLog[pid]&&DB.badgeLog[pid][b]) continue; if(!(admin||(pid===ME&&b.startsWith('pf_')))) continue; if(await run('retrait badge', sb.from('badges_acquis').delete().eq('participant',pid).eq('badge',b))) snap.badges.delete(k); }
    // 4. pronostics
    for(const m of Object.keys(DB.pronos||{})) for(const pid of Object.keys(DB.pronos[m])){ const o=DB.pronos[m][pid]; const k=pid+'|'+m; const j=JSON.stringify(o); if(snap.pronos[k]===j) continue; if(pid!==ME&&!admin) continue;
      const row={participant:pid,mois:m,data:o,locked_at:o.locked?(o.at?o.at+'T12:00:00Z':new Date().toISOString()):null};
      if(await run('pronostic', sb.from('pronostics').upsert(row,{onConflict:'participant,mois'}))) snap.pronos[k]=j; }
    // 5. commentaires
    const seen=new Set(); for(const key of Object.keys(DB.comments||{})) for(const c of DB.comments[key]){ seen.add(c.id); const j=JSON.stringify(Object.assign({key},c)); if(snap.comments[c.id]===j) continue; if(c.by!==ME&&!admin) continue;
      if(await run('commentaire', sb.from('commentaires').upsert({id:c.id,cle:key,auteur:c.by,texte:c.text||null,emoji:c.emoji||null,created_at:c.at||new Date().toISOString(),extra:c.re?{re:c.re}:{}},{onConflict:'id'}))) snap.comments[c.id]=j; }
    for(const id of Object.keys(snap.comments)) if(!seen.has(id)){ if(await run('suppression commentaire', sb.from('commentaires').delete().eq('id',id))) delete snap.comments[id]; }
    // 5 bis. réclamations de performance (fichier envoyé dans le bucket, puis ligne)
    const cseen=new Set(); for(const c of (DB.claims||[])){ cseen.add(c.id); if(c.media&&c.media.pending&&CLAIM_FILES[c.id]){ const path='claims/'+c.id+'.'+(c.media.ext||'jpg'); const up=await sb.storage.from('photos').upload(path,CLAIM_FILES[c.id],{upsert:true,contentType:c.media.type==='video'?'video/mp4':'image/jpeg'}); if(up.error){ errs.push('preuve : '+up.error.message); continue; } delete CLAIM_FILES[c.id]; const su=await sb.storage.from('photos').createSignedUrl(path,86400); c.media={type:c.media.type,path,url:su.data?su.data.signedUrl:''}; }
      const row=claimRow(c); const j=JSON.stringify(row); if(snap.claims[c.id]===j) continue; if(c.pid!==ME&&!admin&&!(c.votes&&c.votes[ME])) continue;
      const exists=c.id in snap.claims; const upd=exists&&c.pid!==ME&&!admin?{extra:row.extra,statut:row.statut,decided_by:row.decided_by,decided_at:row.decided_at}:row; // un votant n'envoie que son vote
      const req=exists?sb.from('reclamations').update(upd).eq('id',c.id):sb.from('reclamations').insert(row);
      if(await run('réclamation', req)) snap.claims[c.id]=j; }
    for(const id of Object.keys(snap.claims)) if(!cseen.has(id)){ if(await run('suppression réclamation', sb.from('reclamations').delete().eq('id',id))) delete snap.claims[id]; }
    // 6. réglages : admin écrit tout ; les autres ne touchent qu'à leurs dispos
    const rj=JSON.stringify({pesee:DB.pesee,season:DB.season,palmares:DB.palmares});
    if(snap.reglages!==rj){ if(admin){ if(await run('réglages', sb.from('reglages').update({pesee:DB.pesee,season:DB.season,palmares:DB.palmares}).eq('id',1))) snap.reglages=rj; }
      else if(ME){ const prev=JSON.parse(snap.reglages||'{}'); const mine=(DB.pesee.dispos||{})[ME]||null; const was=((prev.pesee||{}).dispos||{})[ME]||null; if(JSON.stringify(mine)!==JSON.stringify(was)){ if(await run('dispos', sb.rpc('set_dispo',{reponse:mine}))){ prev.pesee=prev.pesee||{dispos:{}}; prev.pesee.dispos=prev.pesee.dispos||{}; if(mine) prev.pesee.dispos[ME]=mine; else delete prev.pesee.dispos[ME]; snap.reglages=JSON.stringify(prev); } } } }
    cloudStatus(errs.length?errs.join(' · '):null); if(errs.length) toast('Serveur : '+errs[0]);
  }catch(e){ cloudStatus('Enregistrement impossible : '+e.message); }
  finally{ CLOUD.saving=false; }
}

  const pr=[]; for(const m of Object.keys(d.pronos||{})) for(const pid of Object.keys(d.pronos[m])){ const o=d.pronos[m][pid]; pr.push({participant:pid,mois:m,data:o,locked_at:o.locked?(o.at?o.at+'T12:00:00Z':new Date().toISOString()):null}); } if(pr.length){ const r4=await sb.from('pronostics').upsert(pr,{onConflict:'participant,mois'}); if(r4.error) throw new Error('pronostics : '+r4.error.message); }
  const cm=[]; for(const key of Object.keys(d.comments||{})) for(const c of d.comments[key]) cm.push({id:c.id,cle:key,auteur:c.by,texte:c.text||null,emoji:c.emoji||null,created_at:c.at||new Date().toISOString(),extra:c.re?{re:c.re}:{}}); if(cm.length){ const r5=await sb.from('commentaires').upsert(cm,{onConflict:'id'}); if(r5.error) throw new Error('commentaires : '+r5.error.message); }
  const cl=(d.claims||[]).map(claimRow); if(cl.length){ const r7=await sb.from('reclamations').upsert(cl,{onConflict:'id'}); if(r7.error) throw new Error('réclamations : '+r7.error.message); }
  const r6=await sb.from('reglages').update({pesee:d.pesee||{date:null,dispos:{}},season:d.season||DB.season,palmares:d.palmares||[]}).eq('id',1); if(r6.error) throw new Error('réglages : '+r6.error.message);
  await cloudLoad(false);

const state = {saisiePour:null, goalsFor:null, moiShow:{}, ptsDetail:null, screen:'potes', profileId:null, statKey:'poids', rankTab:'prog', evoMetric:'poids', evoAll:true, toast:null, saisieMois:null, confirmDel:null, compA:null, compB:null, confirmClose:false};

/* ---------- Calculs ---------- */
function season(){ return {name:'Saison '+DB.season.num, num:DB.season.num, start:DB.season.start, end:DB.season.end}; }
const isoDay=(d)=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const dayLabel=(iso)=>{const d=new Date(iso+'T12:00:00');return ['dim.','lun.','mar.','mer.','jeu.','ven.','sam.'][d.getDay()]+' '+d.getDate()+' '+['janv.','févr.','mars','avr.','mai','juin','juil.','août','sept.','oct.','nov.','déc.'][d.getMonth()];};
// Fenêtre de la prochaine pesée : 28 jours à partir du lendemain, mais jamais avant un mois après la dernière pesée (date exacte si connue, sinon le mois suivant)
function minNextDate(){ const last=DB.pesee&&DB.pesee.lastDate; let m;
  if(last){ m=new Date(last+'T12:00:00'); m.setMonth(m.getMonth()+1); }
  else { const lm=allMonths().slice(-1)[0]; if(!lm) return null; const [y,mo]=lm.split('-').map(Number); m=new Date(y,mo,1,12); }
  return isoDay(m); }
const nextDays=(n=28)=>{const out=[];const d=new Date(); const min=minNextDate(); let start=new Date(d); start.setDate(d.getDate()+1); if(min&&isoDay(start)<min) start=new Date(min+'T12:00:00'); for(let i=0;i<n;i++){const x=new Date(start);x.setDate(start.getDate()+i);out.push(isoDay(x));}return out;};
const dispoOf=(pid,d)=>(DB.pesee.dispos[pid]||{})[d]||null;
const answered=(pid)=>Object.keys(DB.pesee.dispos[pid]||{}).length>0;
function dayTally(d){ const ok=DB.profiles.filter(p=>dispoOf(p.id,d)==='ok'), no=DB.profiles.filter(p=>dispoOf(p.id,d)==='no'); return {ok,no,all:ok.length===DB.profiles.length}; }
function countdownText(){ const dt=DB.pesee&&DB.pesee.date; if(!dt) return null; const target=new Date(dt+'T08:00:00'); const ms=target-new Date(); if(ms<=0) return {txt:'C’est aujourd’hui, à la balance !',past:true};
  const d=Math.floor(ms/86400000), h=Math.floor(ms%86400000/3600000), m=Math.floor(ms%3600000/60000); return {txt:(d?d+' j ':'')+h+' h '+String(m).padStart(2,'0')+' min',past:false}; }
const allMonths=()=>{const sm=sealed(); return DB.weighins.filter(x=>x.mois!==sm).map(x=>x.mois).sort();}; // mois avec au moins une pesée visible (hors enveloppe)
const addMonths=(m,n)=>{let [y,mo]=m.split('-').map(Number);mo+=n;while(mo>12){mo-=12;y++;}while(mo<1){mo+=12;y--;}return y+'-'+String(mo).padStart(2,'0');};
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const fr=(n,d=1)=>(n==null||isNaN(n))?'·':Number(n).toFixed(d).replace('.',',');
const monthLabel=(m)=>{const [y,mo]=m.split('-');return ['janv.','févr.','mars','avr.','mai','juin','juil.','août','sept.','oct.','nov.','déc.'][+mo-1]+' '+y.slice(2);};
const monthsBetween=(a,b)=>{const r=[];let [y,m]=a.split('-').map(Number);const [y2,m2]=b.split('-').map(Number);while(y<y2||(y===y2&&m<=m2)){r.push(y+'-'+String(m).padStart(2,'0'));m++;if(m>12){m=1;y++;}}return r;};
const currentMonth=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');};
const age=(iso)=>{const d=new Date(iso),n=new Date();let a=n.getFullYear()-d.getFullYear();if(n<new Date(n.getFullYear(),d.getMonth(),d.getDate()))a--;return a;};
const initials=(p)=>p.prenom.replace(/[^A-Za-zÀ-ÿ]/g,'').slice(0,2).toUpperCase();
const weighinsOf=(pid)=>{const sm=sealed(); return DB.weighins.filter(x=>x.profileId===pid&&(!sm||x.mois!==sm)).sort((a,b)=>a.mois<b.mois?-1:1);};
const lastOf=(pid)=>{const l=weighinsOf(pid);return l[l.length-1]||null;};
const firstOf=(pid)=>{const l=weighinsOf(pid), st=season().start; const before=l.filter(x=>x.mois<st); return before.length?before[before.length-1]:(l.find(x=>x.mois>=st)||null);};

function attrs(p, wi){
  if(!wi) return null;
  const h=p.taille/100, ffmi=wi.muscle==null?null:wi.muscle/(h*h); // indice musculaire : muscle Tanita / taille², indépendant du gras
  const PUI=ffmi==null?null:clamp(Math.round(40+(ffmi-18)*50/6),20,99);
  const SEC=wi.gras==null?null:clamp(Math.round(90-(wi.gras-10)*50/15),20,99);
  // Moteur : métabolisme mesuré par la balance rapporté au métabolisme prédit pour l'âge, la taille et le poids (Mifflin-St Jeor). 1,00 → 50, +10 % → 80, +16 % → 99
  const MOT=wi.bmr==null||!p.naissance?null:clamp(Math.round(50+(wi.bmr/bmrPredicted(p,wi)-1)*300),20,99);
  let SYM=null;
  if(wi.segM){ const m=wi.segM;
    const relArm=Math.abs(m.brasG-m.brasD)/Math.max(m.brasG,m.brasD,0.1), relLeg=Math.abs(m.jambeG-m.jambeD)/Math.max(m.jambeG,m.jambeD,0.1);
    const lr=clamp(99-(relArm+relLeg)*400,20,99); // 5 % d'écart sur un membre = -20
    const ratio=(m.brasG+m.brasD)/Math.max(m.jambeG+m.jambeD,0.1);
    const hb=clamp(99-Math.abs(ratio-0.40)*500,20,99); // 0,02 d'écart au ratio = -10
    SYM=Math.round((lr+hb)/2); }
  const sv=wi.visc==null?null:(wi.visc<=5?95:wi.visc<=9?85:wi.visc<=12?65:40);
  const se=wi.eau==null?null:(wi.eau>=55&&wi.eau<=65?90:wi.eau>=50?75:55);
  const SAN=sv==null&&se==null?null:sv==null?se:se==null?sv:Math.round((sv+se)/2);
  const months=weighinsOf(p.id).map(x=>x.mois); const all=monthsBetween(months[0],currentMonth());
  let streak=0, missed=0; for(let i=all.length-1;i>=0;i--){ if(months.includes(all[i])) streak++; else if(all[i]!==currentMonth()) break; }
  missed=all.filter(m=>!months.includes(m)&&m!==currentMonth()).length;
  const REGold=clamp(50+8*streak-10*missed,20,99);
  const REG=wi.segG?clamp(Math.round(90-(wi.segG.tronc-12)*50/18),20,99):null;

const PRONO_STATS=[['poids','Poids','kg',1],['gras','Gras','%',1],['muscle','Muscle','kg',1]];
function pronoMois(){ if(DB.pesee.date) return DB.pesee.date.slice(0,7); if(DB.pesee.revealMois&&!DB.weighins.some(x=>x.mois>DB.pesee.revealMois)) { const m=DB.pesee.revealMois; return DB.weighins.some(x=>x.mois===m)?addMonths(m,1):m; } const last=allMonths().slice(-1)[0]; return last?addMonths(last,1):currentMonth(); }
const pronoBook=(mois)=>(DB.pronos&&DB.pronos[mois])||{};
function pronoTargets(p){ const g=(p.goalsLocked&&p.goals)||{}; const o={}; for(const [k] of PRONO_STATS) if(g[k]!=null) o[k]=g[k]; return o; }
const PRONO_LABEL={ok:'Réussit',ko:'Rate'};
const pronoFixed=(x,pid,k)=>{ if(!x) return false; if(x.fixed) return !!x.fixed[pid+':'+k]; return !!(x.locked&&x.stats&&x.stats[pid]&&typeof x.stats[pid][k]==='string'); }; // anciens pronostics validés : tout figé
const pronoTeamFixed=(x)=>!!(x&&(x.teamFixed||(x.locked&&x.teamFixed===undefined)));
function pronoOpenStats(me,mois){ // ce qu'il me reste à parier : objectifs validés des autres pas encore figés chez moi
  const x=pronoOf(mois,me.id)||{}; let n=0; for(const p of DB.profiles){ if(p.id===me.id) continue; const tg=pronoTargets(p); for(const k of Object.keys(tg)) if(!pronoFixed(x,p.id,k)) n++; } return n; }
const pronoOf=(mois,pid)=>pronoBook(mois)[pid]||null;
function pronoOpen(mois){ if(DB.weighins.some(x=>x.mois===mois)) return false; if(DB.pesee.date&&DB.pesee.date.slice(0,7)===mois) return isoDay(new Date())<DB.pesee.date; return true; }
const pronoLocked=(mois,pid)=>{const x=pronoOf(mois,pid);return !!(x&&x.locked);};
function pronoSave(mois,pid,data,lock){ DB.pronos=DB.pronos||{}; DB.pronos[mois]=DB.pronos[mois]||{}; const cur=DB.pronos[mois][pid]||{}; const nx=Object.assign({},cur,data,{locked:lock||!!cur.locked,at:lock?isoDay(new Date()):cur.at}); if(lock){ nx.fixed=Object.assign({},cur.fixed||{}); for(const [tid,o] of Object.entries(nx.stats||{})) for(const k of Object.keys(o)) nx.fixed[tid+':'+k]=true; nx.teamFixed=true; } DB.pronos[mois][pid]=nx; Store.save(DB); }
const pronoPts=(pred,real,stat)=>{ if(pred==null||real==null) return 0; if(typeof pred==='string') return pred===real?10:0; const d=Math.round(Math.abs(pred-real)*100)/100; return d<=0.3?10:d<=1?5:0; };
function goalOutcome(w,k){ const r=w&&w.goalsResult; if(!r||!r.set||r.set[k]==null) return null; return r.reached.includes(k)?'ok':'ko'; }
function pronoResult(mois,pid){ const x=pronoOf(mois,pid); if(!x||!x.locked) return null; if(!DB.weighins.some(w=>w.mois===mois)) return null; const rows=[]; let pts=0;
  for(const [tid,st] of Object.entries(x.stats||{})){ const t=profile(tid); if(!t) continue; const w=weighinsOf(tid).find(y=>y.mois===mois); for(const [k,n] of PRONO_STATS){ if(st[k]==null) continue; const real=typeof st[k]==='string'?goalOutcome(w,k):(w?w[k]:null); const target=w&&w.goalsResult&&w.goalsResult.set?w.goalsResult.set[k]:null; const p=real==null?0:pronoPts(st[k],real,k); pts+=p; rows.push({tid,k,n,pred:st[k],real,target,val:w?w[k]:null,pts:p}); } }
  const team=[]; const b=beltHistory().find(x=>x.mois===mois); const beltReal=b?b.holder.id:null; const t=trophiesOf(mois);
  for(const [k,label,real] of [['belt','Ceinture',beltReal],['kfc','KFC',t.kfc?t.kfc.p.id:null],['plume','Poids plume',t.plume?t.plume.p.id:null]]){ if(!x[k]) continue; const ok=real!=null&&x[k]===real; if(ok) pts+=10; team.push({k,label,pred:x[k],real,ok}); }
  return {pts,rows,team}; }
function pronoRank(mois){ return DB.profiles.map(p=>({pid:p.id,r:pronoResult(mois,p.id)})).filter(x=>x.r).map(x=>({pid:x.pid,pts:x.r.pts})).sort((a,b)=>b.pts-a.pts); }
function pronoMonths(){ return Object.keys(DB.pronos||{}).filter(m=>DB.weighins.some(w=>w.mois===m)&&m!==sealed()).sort(); }
function pronoTotals(){ const tot={}; for(const m of pronoMonths()) for(const r of pronoRank(m)) tot[r.pid]=(tot[r.pid]||0)+r.pts; return DB.profiles.map(p=>({p,pts:tot[p.id]||0})).sort((a,b)=>b.pts-a.pts); }
function pronoSeenBy(mois,pid){ // ce que les autres parient sur pid : combien le voient réussir chaque objectif (pronos validés)
  const acc={poids:{ok:0,n:0},gras:{ok:0,n:0},muscle:{ok:0,n:0}}; for(const [by,x] of Object.entries(pronoBook(mois))){ if(by===pid||!x.locked||!x.stats||!x.stats[pid]) continue; for(const k of Object.keys(acc)){ const v=x.stats[pid][k]; if(typeof v==='string'){ acc[k].n++; if(v==='ok') acc[k].ok++; } } }
  return Object.assign(acc,{n:Math.max(acc.poids.n,acc.gras.n,acc.muscle.n)}); }
function pronoPanel(me){ const mois=pronoMois(); const open=pronoOpen(mois); const mine=pronoOf(mois,me.id); const nLocked=DB.profiles.filter(p=>pronoLocked(mois,p.id)).length;

function screenPronos(me){ const mois=state.pronoMois||pronoMois(); const open=pronoOpen(mois)&&mois===pronoMois(); const mine=pronoOf(mois,me.id)||{stats:{}}; const locked=!!mine.locked; const others=DB.profiles.filter(p=>p.id!==me.id);

function pronoTable(x,res,who){ const rows=[]; for(const p of DB.profiles){ if(!x.stats||!x.stats[p.id]) continue; const st=x.stats[p.id]; rows.push(`<div class="zone-row" style="flex-wrap:wrap"><span style="width:64px;font-weight:600;font-size:12px">${esc(p.prenom)}</span>${PRONO_STATS.map(([k,n,u])=>{const r=res&&res.rows.find(y=>y.tid===p.id&&y.k===k); const pred=st[k]; const isStr=typeof pred==='string'; return `<span style="flex:1;font-size:12px"><span class="muted">${n}</span> <span class="num" style="${isStr?(pred==='ok'?'color:var(--green)':'color:var(--red)'):''}">${pred==null?'·':isStr?PRONO_LABEL[pred]:fr(pred)}</span>${r&&r.target!=null?` <span class="muted">(cible ${fr(r.target)})</span>`:''}${r&&r.real!=null?` <span class="muted">/ ${isStr?(r.real==='ok'?'réussi':'raté')+(r.val!=null?' à '+fr(r.val):''):fr(r.real)}</span> <span style="color:${r.pts?'var(--green)':'var(--muted)'}">+${r.pts}</span>`:r&&isStr?' <span class="muted">/ pas d’objectif évalué</span>':''}</span>`;}).join('')}</div>`); }
  const team=[['belt','Ceinture'],['kfc','KFC'],['plume','Poids plume']].filter(([k])=>x[k]).map(([k,l])=>{const t=res&&res.team.find(y=>y.k===k); return `<span class="chip" style="${t?(t.ok?'border-color:var(--green);color:var(--green)':'border-color:var(--line)'):''}">${l} : ${esc((profile(x[k])||{}).prenom||'?')}${t?(t.ok?' ✓ +10':' ✗'+(t.real?' ('+esc(profile(t.real).prenom)+')':'')):''}</span>`;});
  return rows.join('')+(team.length?`<div class="row" style="flex-wrap:wrap;gap:6px;margin-top:6px">${team.join('')}</div>`:'')+(res?`<div style="margin-top:6px;font-weight:600;color:var(--gold2)">Total : ${res.pts} points</div>`:''); }
function pronoGoalLine(p){ // ce que vise le participant, pour aider les pronostiqueurs
  const g=p.goals||{}; const parts=PRONO_STATS.filter(([k])=>g[k]!=null).map(([k,n,u])=>`${n.toLowerCase()} ${fr(g[k])} ${u}`);
  if(p.goalsLocked&&parts.length) return `${svg('lock',11,2.4)} Objectifs validés : ${parts.join(', ')}${Object.keys(g).filter(k=>METRICS[k]&&!PRONO_STATS.some(([x])=>x===k)).length?' (+ d’autres stats)':''}.`;
  if(p.goalsLocked) return `${svg('lock',11,2.4)} Objectifs validés sur d’autres stats (pas de cible poids, gras ou muscle).`;

  return 'Pas d’objectif fixé pour l’instant.'; }
function readProno(me){ const mois=pronoMois(); const cur=pronoOf(mois,me.id)||{}; const stats={}; for(const [tid,o] of Object.entries(cur.stats||{})){ const t=profile(tid); if(!t||tid===me.id) continue; const tg=pronoTargets(t); const keep={}; for(const [k] of PRONO_STATS) if(typeof o[k]==='string'&&(tg[k]!=null||pronoFixed(cur,tid,k))) keep[k]=o[k]; if(Object.keys(keep).length) stats[tid]=keep; } return {mois,stats}; }
// badges pronostics
function pronoBadgeFacts(pid){ const months=pronoMonths(); let voyant=false, bestRun=0, run=0, lastCount=0; for(const m of months){ const r=pronoResult(m,pid); const rank=pronoRank(m); if(r){ for(const p of DB.profiles){ const rows=r.rows.filter(x=>x.tid===p.id&&x.real!=null); if(rows.length===3&&rows.every(x=>typeof x.pred==='string'?x.pts>0:Math.abs(x.pred-x.real)<=0.2)) voyant=true; } }
    if(rank.length>=2){ if(rank[0].pid===pid){run++;bestRun=Math.max(bestRun,run);} else run=0; if(rank[rank.length-1].pid===pid) lastCount++; } }

function secretFacts(p){ const s=p.secret||{}; const opens=s.opens||{}; const days=Object.keys(opens); const hours=[].concat(...Object.values(opens));
