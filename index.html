  return `<button class="mini ${ct.fx?'fx-'+ct.fx:''}" style="background:${ct.css||T.accent};--spin:${ct.css||T.accent}" data-go="carte" data-id="${p.id}" aria-label="Voir la carte de ${esc(p.prenom)}"><div class="in ${mo.anim?'holo':''} ${mo.fx?'fx-'+mo.fx:''}" style="background:${mo.css?mo.css+',':''}${T.bg};color:${T.ink}">
    <div class="top"><div class="ovr num">${a&&a.overall!=null?a.overall:'·'}</div><div class="av ${ca.fx&&!sh.clip?'av-'+ca.fx:''}" style="${avatarStyle(p,ca,T,sh)}">${sh.clip?avatarInner(p,ca,T,sh):initials(p)}${ca.id==='couronne'||ca.crown?crownSvg(22):''}${ca.ring?ringSvg(ca.ring,ca.ringColor||T.accent,ca.ringFx):''}</div></div>
    <div class="nm">${esc(p.prenom)}</div><div class="tr">${T.label}${stars?' <span class="stars-s">'+'★'.repeat(stars)+'</span>':''}</div>${ti.id!=='none'?`<div class="ttl-s">${ti.name}</div>`:''}${pins.length===1?`<div class="pins-s"><span class="eqb-s" style="background:${pins[0].color}33;border:1px solid ${pins[0].color}">${svg(pins[0].icon,10,2.6)} ${pins[0].name}</span></div>`:pins.length?`<div class="pins-s">${pins.map(b=>`<span class="eqr-s" style="background:${b.color}33;border:1px solid ${b.color};color:${b.color}" title="${b.name}">${svg(b.icon,11,2.6)}</span>`).join('')}</div>`:''}${(()=>{const b=beltNow();return b&&b.holder.id===p.id?'<span class="belt-tag" style="margin-top:4px">CEINTURE SPC</span>':'';})()}<div class="rl"></div>
    <div class="st num">${wi?fr(wi.poids)+' kg'+(wi.gras!=null?' · '+fr(wi.gras)+' % gras':''):'aucune donnée'}</div><div class="dl">${delta}</div></div></button>`;
}
function nav(){
  const items=[['potes','users','Participants'],['classement','trophy','Classement'],['objectifs','target','Objectifs'],['perfs','dumbbell','Perfs'],['moi','card','Profil']];
  const nv=document.getElementById('nav'); nv.style.gridTemplateColumns=`repeat(${items.length},minmax(0,1fr))`; const meP=ME&&profile(ME); const counts={moi:meP?newCount(meP):0,potes:meP?unseenCommentsTotal(meP,'potes'):0,perfs:meP?perfNewTotal(meP):0,classement:meP?unseenCommentsTotal(meP,'classement'):0,objectifs:meP?newGoals(meP).length+goalEvents(meP).length+todoAlerts(meP).length:0}; nv.innerHTML=items.map(([k,i,l])=>`<button data-nav="${k}" ${state.screen===k||(k==='potes'&&state.screen==='carte')||(k==='moi'&&(state.screen==='badges'||state.screen==='profil'))||(k==='objectifs'&&state.screen==='evolution')?'aria-current="page"':''}>${svg(i,22,2)}${l}${counts[k]?`<span class="navdot" aria-label="${counts[k]} nouveauté${counts[k]>1?'s':''}">${counts[k]}</span>`:''}</button>`).join('');
}
/* ---------- Aide intégrée : un « ? » par encart et un gros « ? » par page ---------- */
const HELP_PAGES={
  who:{t:'Qui es-tu ?',b:`<p>Choisis ton profil pour entrer. Chaque participant a un code à 4 chiffres : il protège la modification de tes infos, de tes objectifs et de tes dispos. Tout le monde voit les chiffres de tout le monde, c’est le principe du jeu.</p><p>Première fois ? « Créer mon profil » : prénom ou pseudo, date de naissance, taille, sexe, code. Les pesées, elles, sont saisies par l’admin.</p>`},
  potes:{t:'Accueil · Participants',b:`<p>La page d’équipe. De haut en bas : la <strong>ceinture SPC</strong> et son tenant, les quatre <strong>trophées du mois</strong> (Poids lourd, Poids plume, KFC, BK), la <strong>prochaine pesée</strong> avec le compte à rebours, les <strong>titres</strong> de progression, le bloc <strong>Le plus sec</strong>, le <strong>fil</strong> de ce qui s’est passé, puis la <strong>carte</strong> de chaque participant.</p><p>Touche une carte pour l’ouvrir en grand. Le bouton doré compare deux participants face à face. Chaque encart a son propre « ? » pour le détail.</p><p>Le mois en cours est affiché en haut ; une saison dure 3 mois.</p>`},
  carte:{t:'Carte complète d’un participant',b:`<p>Tout ce qui concerne une personne, à un seul endroit. En haut, la barre des participants pour passer de l’un à l’autre. Puis la carte FIFA du participant : la <strong>note globale</strong> sur 99 en haut à gauche, le <strong>grade</strong> (Bronze, Argent, Or, Diamant, Légende), l’avatar, le nom, le titre et les badges épinglés, puis les six <strong>attributs</strong>. Touche un attribut, un badge, le titre ou les étoiles sur la carte pour avoir l’explication.</p><p>En dessous : les tuiles de stats (touche une tuile pour son historique), la silhouette par zone, le niveau et ce qui manque pour le grade suivant, les objectifs, le mètre ruban, les perfs EGYM, les photos et la vitrine des trophées.</p><p>Boutons du haut : retour, comparer, et sur ta propre carte partager et modifier tes infos.</p>`},
  stat:{t:'Historique d’une stat',b:`<p>La courbe d’une seule stat au fil des pesées, avec ton objectif en pointillé doré s’il est fixé. En dessous, le tableau mois par mois avec la variation d’une pesée à l’autre.</p><p>Toutes les stats ont cet écran : poids, gras, muscle, zones, mensurations, perfs EGYM, attributs de la carte.</p>`},
  classement:{t:'Classement',b:`<p>Le classement se joue sur la <strong>progression</strong> depuis le point de départ de la saison, jamais sur les valeurs brutes : 4 points par kilo de gras perdu, 6 points par kilo de muscle pris. Tant qu’un participant n’a que le poids (pas d’analyse Tanita), 3 points par kilo perdu sur la balance.</p><p>Onglets : la saison en cours, le mois, et toutes saisons. Touche un score pour voir le calcul. Le podium montre les trois premiers.</p><p>À la clôture d’une saison (bouton admin), le premier devient champion, entre au palmarès, et la dernière pesée de chacun devient le nouveau point de départ.</p><p>Boutons : Records de l’équipe, règles complètes.</p>`},
  ceinture:{t:'Ceinture et trophées',b:`<p>Tout sur la ceinture SPC : la règle, l’historique mois par mois (prise, conservée, pas de challenger), les titres mensuels avec qui les a gagnés combien de fois, et la vitrine de chacun (ceintures, Poids lourd, Poids plume, KFC, BK).</p>`},
  date:{t:'Prochaine pesée',b:`<p>C’est ici que l’équipe se met d’accord sur la date. Chacun touche les jours du calendrier depuis son profil : un tap = dispo (vert), deux = indispo (rouge barré), trois = effacé. Quand toute l’équipe est dispo un jour, il passe en <strong>or</strong>.</p><p>Le calendrier commence au plus tôt un mois après la dernière pesée, sur 28 jours. Quand tout le monde a répondu, les meilleurs jours remontent. L’admin (ou n’importe qui) fixe la date ; un compte à rebours s’affiche alors sur l’accueil. Après la pesée, les dispos sont remises à zéro.</p>`},
  moyenne:{t:'Moi vs la moyenne',b:`<p>Compare tes chiffres aux références de la population pour ton âge et ton sexe (masse grasse d’après les tables Cooper, indice musculaire d’après les normes d’indice de masse maigre, viscérale Tanita, eau, tour de taille d’après l’OMS, métabolisme prédit par Mifflin-St Jeor), tes performances aux normes publiées (pompes, VO2max, pouls, développé couché, 5 et 10 km, Cooper, gainage, tractions) et à l’équipe (ton rang sur chaque stat).</p><p>Chaque jauge indique la zone où tu te situes et la cible pour passer dans la zone suivante.</p>`},
  records:{t:'Records de l’équipe',b:`<p>Les meilleures valeurs jamais atteintes dans l’équipe, toutes pesées confondues : gras le plus bas, indice musculaire le plus haut, note la plus haute, viscérale la plus basse, plus grosse perte de gras ou prise de muscle sur un mois, perfs EGYM, BioAge. C’est de l’information, pas un trophée : rien n’est compté dans la vitrine.</p>`},
  regles:{t:'Règles du jeu',b:`<p>Le résumé de toutes les règles : grades, attributs, points et saisons, ceinture et trophées, objectifs, badges, qui saisit, protocole de pesée. Chaque section a son « ? » pour aller plus loin.</p>`},
  compare:{t:'Face à face',b:`<p>Deux participants côte à côte : le radar des six attributs superposés, puis chaque stat en vis-à-vis avec le meilleur des deux en couleur. Change n’importe lequel des deux avec les menus.</p>`},
  saisie:{t:'Saisie d’une pesée (admin)',b:`<p>Réservé à l’admin pour que personne ne puisse arranger ses chiffres. Choisis le participant et le mois, puis recopie le ticket Tanita dans l’ordre : poids, gras, muscle, eau, viscérale, métabolisme, âge métabolique, puis muscle et gras par zone. Le mètre ruban, les photos, les perfs EGYM et les performances (pompes, tractions, chronos, charges) sont facultatifs mais débloquent des défis et des paliers. Pour les performances, ne saisis que ce qui a été testé devant les autres ce jour-là, tenues et chronos en mm:ss, charges en kilos.</p><p>À l’enregistrement : les objectifs verrouillés du participant sont évalués puis remis à zéro, la carte est révélée avec son nouveau grade, les badges gagnés et la place au classement. Modifier un mois existant garde le bilan d’objectifs déjà fait.</p>`},
  profil:{t:'Mes infos',b:`<p>Tes informations de base : prénom, date de naissance, sexe, taille, code à 4 chiffres, objectif principal (il pilote les cibles proposées dans Objectifs). Case « photos privées » pour que tes photos ne soient visibles que par toi. Raccourcis vers tes objectifs et tes dispos.</p><p>Pour l’admin : zone admin (saisie, hors concours, sauvegarde, réinitialisation).</p>`},
  objectifs:{t:'Objectifs',b:`<p>Une cible par stat, évaluée à ta prochaine pesée. Trois colonnes : <strong>Actuel</strong> (ta dernière mesure), <strong>Proposé</strong> (un pas mensuel réaliste selon ton objectif principal, touche-le pour le prendre), <strong>Ma cible</strong> (libre). Les stats liées se remplissent toutes seules : gras % et gras en kg, poids et IMC, muscle et indice…</p><p>« Enregistrer le brouillon » garde tes cibles modifiables. « Valider et verrouiller » les fige jusqu’à la pesée : elles sont alors évaluées (atteint / raté par stat), comptées pour les badges d’objectifs, puis remises à zéro pour le mois suivant. Les puces en haut montrent les objectifs des autres.</p>`},
  perfs:{t:'Perfs',b:`<p>L’onglet des performances. En haut, un rond par participant : touche-le (ou balaie la fiche à gauche ou à droite) pour voir ses paliers, ses réclamations et ses max machines ; un chiffre rouge signale une perf à valider ou à refuser. Puis les records de l’équipe par exercice : touche un exercice pour voir les cinq paliers (touche un palier pour le réclamer avec photo ou vidéo) et qui a fait quoi, un nom pour sa fiche. Les réclamations sont validées par le vote des autres : l’arbitre (Anton) valide à lui seul, sinon il faut la majorité (3 sur 5). Enfin les records machines de l’équipe.</p><p>Les courbes d’évolution sont désormais sur la carte complète et à l’accueil (icône courbe).</p>`},
  evolution:{t:'Évolution',b:`<p>En haut, huit tuiles : l’écart entre ta première et ta dernière mesure pour poids, gras, muscle, viscérale, eau, gras du tronc, note et tour de taille (vert = bon sens, orange = mauvais sens). Touche une tuile pour mettre la courbe sur cette stat.</p><p>Les puces et le menu « Toutes les stats » choisissent la courbe ; « Toute l’équipe » superpose les courbes de chacun. En bas, l’historique de tes pesées (l’admin peut modifier ou supprimer).</p>`},
  pronos:{t:'Pronostics',b:`<p>Parie sur les objectifs des autres avant la pesée : pour chaque participant, « Réussit » ou « Rate » sur son objectif poids, gras et muscle (ceux qu’il a validés dans l’onglet Objectifs), plus qui prend la ceinture, le KFC et le Poids plume. 10 points par bonne réponse. Validés dans le mois, figés ensuite, visibles de tous une fois validés. Verdict à la révélation, avec les points et le classement des pronostiqueurs.</p><p>Les badges : Voyant (les trois objectifs de quelqu’un devinés juste le même mois), Nostradamus (meilleur trois mois de suite), Boule fêlée (dernier deux fois).</p>`},
  ceremonie:{t:'Révélation des cartes',b:`<p>Les cartes du mois, une par une, du dernier au premier de la saison, puis la ceinture, les trophées, le verdict des pronostics et ta carte avec tes nouveautés. Commente ou réagis sur chaque carte avec la bulle.</p>`},
  moi:{t:'Mon profil',b:`<p>Ta carte, tes raccourcis, et tout ce qui se personnalise : photo de profil, badges épinglés, contour, titre, cadre d’avatar, motif de fond, thème de l’appli, devise (débloquée avec la première ceinture), étoiles, vitrine, puis la liste de tous les défis par rareté, tes max par machine EGYM, la section Performances (trente exercices à paliers) et les badges de l’équipe.</p><p>Chaque section ne montre que ce que tu possèdes ; « Voir tous » affiche aussi le verrouillé. Touche n’importe quel élément pour sa fiche : description, condition de déblocage, rendu sur ta carte (l’élément clignote), et « Équiper » s’il est à toi.</p><p>Quatre raretés : commun (facile, badge seul), rare (moyen, contour ou titre), épique (difficile, cadre ou motif animé), légendaire (très difficile, thème). Un défi réussi reste acquis, sauf les grades.</p>`},
  badges:{t:'Badges',b:`<p>La liste de tes badges et de ceux de l’équipe. Cette page est remplacée par l’onglet Profil.</p>`}
};
const HELP_SECTIONS=[
  ['ceinture','Ceinture SPC',`<p>La ceinture est <strong>remise en jeu à chaque pesée mensuelle</strong>. Elle va à celui qui a la meilleure progression du mois : 4 points par kilo de gras perdu, 6 par kilo de muscle pris (ou 3 par kilo perdu sur la balance sans analyse). Il faut deux pesées pour concourir.</p><p>Si personne n’a deux pesées dans le mois, le tenant la garde (« pas de challenger »). Le tenant a le tag CEINTURE SPC sur sa carte, une étoile par mois de règne, et peut équiper le titre « Tenant de la ceinture » et le thème Doré tant qu’il la porte. Touche l’encart pour l’historique.</p>`],
  ['lourd','Poids lourd',`<p>Trophée positif du mois : la <strong>plus grosse prise de muscle</strong> en kilos entre deux analyses Tanita, au moins 0,3 kg. Compté dans la vitrine et débloque le titre « Poids lourd » puis, à trois, « Bâti béton ».</p>`],
  ['plume','Poids plume',`<p>Trophée positif du mois : la <strong>plus grosse perte de gras</strong> en kilos entre deux analyses Tanita, au moins 0,3 kg. Compté dans la vitrine et débloque le titre « Poids plume » puis, à trois, « La Lame ».</p>`],
  ['kfc','KFC',`<p>KFC = <strong>Kilos Franchement Conservés</strong>, le trophée moqueur. Il va à celui qui a la pire évolution de gras du mois : la plus grosse reprise, ou sinon la plus petite perte. Uniquement sur le gras entre deux analyses Tanita, jamais sur le poids, et il faut au moins deux candidats. « Personne, bravo » quand il n’y a pas de quoi le donner. Il débloque quand même des cosmétiques de la honte (contour Poulet, thème Rose bonbon).</p>`],
  ['bk','BK',`<p>BK = <strong>Bide King</strong>. Le gras du tronc (en %) le plus haut à la pesée du mois. C’est un état, pas une évolution : tant que tu as le plus gros ventre de l’équipe, il est à toi. Débloque le titre « Bide King » et le thème Mode gras, à assumer.</p>`],
  ['pesee','Prochaine pesée',`<p>Le compte à rebours jusqu’à la date fixée, ou l’état des réponses (« 3 sur 6 ont répondu », jours où tout le monde est dispo). Touche l’encart pour donner tes dispos. Détail dans la page Prochaine pesée.</p>`],
  ['titres','Titres de',`<p>Titres mensuels de <strong>progression</strong>, attribués à chaque pesée : bras, jambes et tronc en progression (évolution en % de la masse musculaire de la zone depuis la pesée précédente). Aucun titre ne dépend de la taille ou du poids. Ils comptent dans la vitrine et pour les badges Premier titre, Collectionneur, Colosse (bras + jambes le même mois) et Grand chelem (les trois).</p>`],
  ['sec','Le plus sec',`<p>Information, pas un titre : qui a le gras le plus bas sur les bras, les jambes et le tronc à la pesée du mois. Quand un participant « hors concours » (réglé par l’admin, Anton par défaut) est devant, on affiche aussi le premier des autres, « sauf lui ». Rien n’est compté.</p>`],
  ['fil','Fil de l’équipe',`<p>Ce qui s’est passé, du plus récent au plus ancien : pertes et prises de chacun, première pesée, ceinture prise ou conservée, trophées du mois, titres, badges débloqués, champion de saison. Les badges y apparaissent le mois où ils ont été gagnés. Touche une ligne pour voir de quoi il s’agit : un badge ouvre sa fiche (comment on le gagne, ce qu’il rapporte), une perte ou une prise ouvre la courbe, une ceinture ou un trophée ouvre son explication.</p>`],
  ['cartes','Cartes des participants',`<p>La carte complète de chaque participant, telle qu’il l’a personnalisée : note, grade, étoiles, avatar et cadre, titre, badges épinglés, attributs, contour, motif et animations. Dessous : dernier poids, % de gras, points de progression sur la saison et la ceinture s’il la porte. Touche un attribut, un badge ou le titre pour son explication, ailleurs sur la carte pour l’ouvrir en grand.</p>`],
  ['comparer','Comparer',`<p>Ouvre le face à face avec toi à gauche et le premier autre participant à droite ; change les deux dans les menus.</p>`],
  ['bigcard','La carte',`<p><strong>Note globale</strong> sur 99 : moyenne pondérée des attributs (Puissance et Sèche comptent double). Elle n’existe qu’avec une analyse Tanita.</p><p><strong>Attributs</strong> (20 à 99) : PUI Puissance = muscle ÷ taille² ; SÈC Sèche = % de gras ; MOT Moteur = métabolisme mesuré ÷ métabolisme prédit pour ton gabarit ; ÉQU Équilibre = symétrie gauche-droite et rapport bras / jambes ; SAN Santé = viscérale et eau ; TRC Tronc = gras du tronc.</p><p><strong>Grades</strong> : Argent gras ≤ 18 %, indice ≥ 19, viscérale ≤ 12. Or note ≥ 65, gras ≤ 15, indice ≥ 20, viscérale ≤ 9. Diamant note ≥ 80, gras ≤ 12, indice ≥ 21, viscérale ≤ 5. Légende note ≥ 85, gras ≤ 10, indice ≥ 22, viscérale ≤ 3. Un mois sans pesée fait descendre d’un grade.</p><p>Touche un attribut, un badge, le titre ou les étoiles directement sur la carte.</p>`],
  ['tuiles','Tuiles de stats',`<p>Les mesures de la dernière pesée : poids, gras, muscle, IMC, eau, viscérale, métabolisme, âge métabolique… Un objectif fixé s’affiche en doré sur la tuile. Touche une tuile pour la courbe et le tableau mois par mois.</p>`],
  ['vitrine','Vitrine de',`<p>Ce que ce participant a gagné : mois avec la ceinture, trophées Poids lourd et Poids plume, KFC et BK. Les compteurs se recalculent à partir de l’historique, rien n’est saisi à la main.</p>`],
  ['objectifs-carte','Objectifs pour la prochaine pesée',`<p>Les cibles fixées par ce participant, avec la valeur actuelle en face. « Validés » = verrouillées jusqu’à la pesée. « Brouillon » = encore modifiables. Touche une ligne pour l’historique de la stat.</p>`],
  ['bilan','Bilan de',`<p>Le résultat des objectifs à la dernière pesée évaluée : valeur obtenue / cible, atteint ou raté pour chaque stat. C’est ce bilan qui donne les badges 1, 2, 5 objectifs, Tous les objectifs (5 minimum), Zéro pointé.</p>`],
  ['zones','Muscle · gras par zone',`<p>La Tanita mesure séparément le tronc, chaque bras et chaque jambe : masse musculaire en kilos et gras en %. La silhouette se colore selon l’évolution du mois. Les écarts gauche-droite nourrissent l’attribut Équilibre ; le gras du tronc nourrit Tronc et le BK. Touche une zone pour son historique.</p>`],
  ['ruban','Mètre ruban',`<p>Les sept tours au mètre ruban : cou, poitrine, taille, bassin, bras, cuisse, mollet. Le tour de taille sert au rapport taille / taille debout (OMS : viser moins de 0,5) et aux défis -2, -5, -10, -15 cm. À mesurer au même endroit à chaque fois.</p>`],
  ['machines','Performances machines',`<p>Ton max en kilos, saisi par toi depuis ton profil quand tu bats ton record (la date est gardée). Deux groupes : les machines EGYM (tirage vertical, développé assis, développé épaules, tirage horizontal, adducteurs, abdominaux, extension lombaires, extension de jambes, presse à cuisses, flexion de jambes) et les mouvements de base à la barre (squat, développé couché, soulevé de terre, développé militaire, rowing, hip thrust, tractions et dips lestés, curl, presse libre), une répétition propre. Les charges relevées par l’admin lors des pesées comptent aussi, on affiche le plus haut des deux.</p><p>Ce que ça débloque : les défis Presse 2,5 × et Tirage 1,5 × (max rapporté à ton poids de la dernière pesée), et les paliers Squat barre, Développé couché et Soulevé de terre de la section Performances, calculés en multiple de ton poids de corps. Vu qu’on ne teste pas un max lourd le jour de la pesée (risque de blessure), une vidéo partagée au groupe fait foi.</p>`],
  ['perf','Performances',`<p>Quarante-trois exercices testés le jour de la pesée devant les autres et saisis par l’admin : poids de corps (pompes, tractions, gainage, squats, dips, pistol squats, burpees, muscle-ups, suspension, L-sit, chaise, gainage latéral, pompes diamant, claquées, archer, à une main), cardio (course sans arrêt, 5 km chrono, test de Cooper, vélo, rameur 2 km, natation, corde à sauter, double-unders, VO2max, fréquence cardiaque au repos) et force (squat barre, développé couché, soulevé de terre, marche du fermier, en multiple du poids de corps).</p><p>Cinq paliers par exercice : Bronze (badge et un petit lot de cosmétiques modestes : contour terne, titre d’apprenti, fil de bronze, motif discret, teinte), Argent (titre), Or (contour, difficile), Diamant (cadre ou motif animé, très difficile), Légende (thème de l’appli, extrême). Plus le palier monte, plus le cosmétique est beau ; les motifs de fond discrets du Bronze sont là pour que tout le monde en ait vite un. Chaque pastille allumée est un palier atteint. Un palier reste acquis même si la perf baisse ensuite, sauf retrait par l’admin (récompenses comprises). Touche un exercice pour le standard d’exécution, les cinq seuils et les récompenses, et « Visualiser » pour voir le rendu sur ta carte. Les paliers ne comptent pas dans les 96 défis ni pour Trésorier et Panthéon.</p>`],
  ['pronos','Pronostics',`<p>Avant chaque pesée, parie sur les objectifs des autres : pour chacun, dis s’il va réussir ou rater son objectif poids, gras et muscle (seulement ceux qu’il a validés), et devine qui prend la ceinture, le KFC et le Poids plume. 10 points par bonne réponse. On valide dans le mois, et une réponse validée ne change plus, mais si quelqu’un fixe ses objectifs après ta validation tu peux compléter et revalider ; c’est seulement après avoir validé qu’on voit les pronostics des autres. Verdict à la révélation, classement des pronostiqueurs sur la saison, badges Voyant, Nostradamus et Boule fêlée.</p>`],
  ['pronos-form','Mes pronostics',`<p>Pour chaque participant, ses objectifs validés avec sa dernière valeur et sa cible : touche « Réussit » ou « Rate ». Pas d’objectif validé, pas de pari sur cette stat. « Enregistrer le brouillon » garde tes choix sans les figer ; « Valider » les fige après confirmation. Tu ne pronostiques pas sur toi-même.</p>`],
  ['pronos-autres','Les pronostics des autres',`<p>Visibles seulement après avoir validé les siens, pour que le dernier ne recopie pas les autres. Touche un nom pour le détail, et la bulle pour chambrer. Après la pesée, le réel (réussi ou raté, avec la valeur) s’affiche à côté de chaque pari avec les points.</p>`],
  ['verdict','Verdict',`<p>Les points de chacun pour cette pesée, du meilleur pronostiqueur au moins bon. Le dernier deux fois reçoit Boule fêlée.</p>`],
  ['pronostiqueurs','Classement des pronostiqueurs',`<p>Total des points de pronostics sur la saison, à part du classement progression : ça ne joue pas sur la ceinture.</p>`],
  ['enveloppes','Enveloppes',`<p>Le jour de la pesée, les cartes saisies par l’admin restent sous enveloppe jusqu’à l’heure de révélation (20 h par défaut, réglable sur la page Prochaine pesée). À l’heure dite, « Ouvrir les enveloppes » montre les cartes une par une, du dernier au premier de la saison, puis la ceinture, les trophées, le verdict des pronostics et ta propre carte avec tes nouveautés. L’admin peut ouvrir plus tôt si tout le monde est là.</p>`],
  ['ceremonie','Révélation',`<p>Une étape à la fois : « Suivant » pour avancer, la flèche pour revenir. Chaque carte a sa bulle pour commenter ou réagir. À la fin, ta carte et ce que tu as gagné ce mois-ci.</p>`],
  ['objectifs-equipe','Objectifs de l’équipe',`<p>Tout le monde sur une ligne : la cible poids, gras et muscle de chacun, avec sa dernière valeur en dessous, et l’état (validés, brouillon, aucun). Touche une ligne pour voir tous ses objectifs en détail et son bilan.</p>`],
  ['a-faire','À faire',`<p>Une alerte rouge reste affichée tant que tu n’as pas validé tes objectifs pour la prochaine pesée, ou pas fait (ou complété) tes pronostics. Elle compte dans le chiffre rouge de l’onglet Objectifs et disparaît dès que c’est fait.</p>`],
  ['machines-equipe','Performances machines',`<p>Le max du participant choisi par machine EGYM et mouvement à la barre, avec le record de l’équipe sous chaque ligne. Sur ta propre fiche, tu saisis tes max toi-même (« Enregistrer mes max »).</p>`],
  ['reclamations','Réclamations de performance',`<p>Chacun peut déclarer un record (pompes, tractions, escaliers…) avec une photo ou une vidéo en preuve : onglet Perfs, touche l’exercice puis « Réclamer un palier ». Les autres participants regardent la preuve et votent. Validée dès que l’arbitre (Anton, réglable par l’admin) valide, ou qu’une majorité valide (3 sur 5) : la performance compte comme un record et débloque le palier et ses cosmétiques. Refusée à la majorité de refus (on peut la refaire). Une fois décidée, elle ne change plus, mais ceux qui n’ont pas voté gardent la notification et doivent quand même voter. Un vote se change tant que ce n’est pas décidé. Les réclamations à voter s’affichent sur l’accueil et dans Perfs, avec un chiffre rouge sur le participant concerné et sur l’onglet Perfs.</p>`],
  ['perfs-liste','Performances',`<p>Les 43 exercices du participant choisi, avec son record, son palier (pastilles) et le record de l’équipe. Touche un exercice : le standard, les cinq paliers (sur ta propre fiche, touche un palier pour le réclamer avec photo ou vidéo) et le classement de l’équipe ; touche un nom pour sa fiche avec les récompenses de chaque palier.</p>`],
  ['evo-bouton','Évolution',`<p>Ouvre les courbes de la saison : chaque stat pesée après pesée, pour toi et pour les autres, avec les objectifs en pointillé. Aussi accessible depuis la carte complète (icône courbe).</p>`],
  ['cosmetiques-dessins','Cosmétiques dessinés',`<p>Les motifs de fond des paliers sont de vrais dessins : mosaïques (vagues, feuilles, cercles, hexagones, éclairs, étoiles, chaînes, haltères, battements, gouttes, flocons, triangles, flèches, nuages, boucliers, bulles, cordes) aux trois premiers paliers, grandes silhouettes sur toute la carte (montagnes, flammes, soleil, rayons, skyline, escaliers, couloirs, lauriers) à Diamant et Légende. Les cadres d’avatar ont une forme dessinée autour de la photo : clous, pointillés, triangles, chaîne, hexagone, lauriers, rayons, engrenage, pointes, pétales, vagues, flammes, éclairs, couronne, animés aux deux derniers paliers. Les badges épinglés sont des médaillons hexagonaux à la couleur du badge.</p>`],
  ['perf-strip','Participants',`<p>Un rond par participant. Touche-le pour voir ses paliers, ses réclamations et ses max machines ; balaie la fiche vers la gauche ou la droite pour passer au suivant. Le chiffre rouge sur un rond : le nombre de résultats à dévoiler chez lui (perfs relevées à une pesée, max machines, réclamations déposées ou validées) et de réclamations à voter ; sur toi, une réponse à tes réclamations. Chaque résultat se dévoile un par un avec « Voir le résultat ».</p>`],
  ['perf-nouveau','Résultats à dévoiler',`<p>Le nombre de résultats de ce participant que tu n’as pas encore vus : perfs relevées à une pesée, max machines, réclamations déposées, paliers validés. Ils sont cachés sur leur ligne, dans la liste des exercices ou des machines : descends, trouve la ligne marquée « Voir le résultat » et touche le bouton. Chaque ligne dévoilée retire ses notifications, les autres restent. Les réclamations à voter restent comptées tant que tu n’as pas voté.</p>`],
  ['objectifs-vide','Pas d’objectif fixé',`<p>Tu n’as pas encore d’objectifs validés pour la prochaine pesée. Touche pour aller les fixer : trois colonnes, ta valeur actuelle, une proposition réaliste, ta cible. Validés, ils sont évalués à la pesée suivante.</p>`],
  ['sans-tanita','Sans analyse',`<p>Une pesée sans analyse Tanita (poids seul) ou pas de pesée du tout : la carte, les attributs, le grade, les défis de composition et la page « Moi vs la moyenne » attendent la première analyse complète. Le poids seul compte quand même pour la progression (3 points par kilo perdu).</p>`],
  ['avstrip','Participants',`<p>Un rond par participant, photo ou initiales, contour doré pour celui dont la carte complète est affichée. Touche un rond pour passer directement à sa carte complète, sans repasser par l’accueil.</p>`],
  ['ses-badges','Badges de',`<p>Les défis débloqués par ce participant, du plus rare au plus commun, le nombre de paliers de performance atteints et de badges secrets trouvés (sans dire lesquels), et les cosmétiques qu’il a équipés. Touche un badge pour sa fiche.</p>`],
  ['vu-par','Vu par les autres',`<p>Pour chacun de tes objectifs validés, combien des autres parient que tu le réussis. À toi de leur donner tort.</p>`],
  ['fantome','Carte fantôme',`<p>Ta carte d’il y a trois mois (ou du point de départ) à côté de celle d’aujourd’hui, avec les mêmes cosmétiques : seuls les chiffres changent. En dessous, l’écart sur la note et les six attributs.</p>`],
  ['secrets','Badges secrets',`<p>Des badges cachés, sans description tant qu’ils ne sont pas trouvés. Ils se gagnent en utilisant l’appli de façon inattendue : des horaires, des jours, des gestes, des habitudes. Chacun débloque un vrai cosmétique, masqué par « ??? » dans les listes tant qu’il n’est pas à toi. Trouvés, ils comptent pour Trésorier et Panthéon et s’épinglent comme les autres.</p>`],
  ['devise','Devise',`<p>Une phrase libre de 30 caractères, en italique sous ton titre, visible par tout le monde sur ta carte et dans le fil de l’accueil quand tu la changes. Elle se débloque avec ta première ceinture SPC (défi Ceinture SPC, rare). Tu la changes quand tu veux ; l’admin peut effacer une devise qui dépasse les bornes.</p>`],
  ['egym','Performances EGYM',`<p>Les écrans de l’appli EGYM : BioAge, âges force, souplesse, métabolisme et cardio, puis les charges par machine. Elles ont leur historique et leurs objectifs, et des défis (presse à 2,5 fois le poids de corps, tirage à 1,5, âge cardio dix ans sous l’âge réel, toutes perfs en hausse).</p>`],
  ['photos','Photos',`<p>Face, profil, dos, compressées et stockées dans l’appli. « Avant · après » apparaît dès deux mois de photos de face. Chacun peut rendre ses photos privées depuis Mes infos. Trois photos sur une même pesée débloquent le défi Sous tous les angles.</p>`],
  ['radar','Radar',`<p>Les six attributs sur une toile d’araignée : plus la surface est grande, plus la carte est complète. Dans le face à face, les deux participants sont superposés.</p>`],
  ['niveau','Niveau',`<p>Ce qu’il manque pour le grade suivant, avec les seuils : grade actuel, gras, indice musculaire, viscérale. Un grade n’est pas acquis : il se recalcule à chaque pesée, et un mois sans pesée fait descendre d’un cran.</p>`],
  ['historique','Historique',`<p>Tes pesées une par une. Touche une ligne pour voir les stats du mois. Seul l’admin peut modifier ou supprimer une pesée.</p>`],
  ['mois','Mois par mois',`<p>La valeur à chaque pesée et la variation par rapport à la pesée précédente, en couleur selon le bon sens pour cette stat.</p>`],
  ['podium','Podium',`<p>Les trois premiers du classement sélectionné, par points de progression. Touche un score plus bas pour voir le détail du calcul.</p>`],
  ['cemois','Ce mois-ci',`<p>Le résumé du mois pour un participant : ce qu’il a perdu ou pris, les titres et trophées, les badges débloqués.</p>`],
  ['palmares','Palmarès',`<p>Les saisons terminées : numéro, période, champion et ses points, classement complet. Un champion garde sa mention sur sa carte et débloque les cosmétiques légendaires de champion.</p>`],
  ['regle','Règle',`<p>La règle complète de la ceinture et des trophées, telle qu’appliquée par l’appli.</p>`],
  ['hist-ceinture','Historique de la ceinture',`<p>Mois par mois : qui portait la ceinture, prise ou conservée, et les points du mois. « Conservée (pas de challenger) » quand personne n’avait deux pesées.</p>`],
  ['titres-mensuels','Titres mensuels',`<p>Chaque titre et qui l’a gagné combien de fois depuis le début.</p>`],
  ['vitrine-equipe','Vitrine',`<p>Les compteurs de chacun : ceintures, PL (Poids lourd), PP (Poids plume), KFC, BK.</p>`],
  ['pesee-fixee','Pesée fixée',`<p>La date retenue et le compte à rebours. Qui a dit dispo ce jour-là. « Changer » annule la date pour en refixer une autre. Après la pesée, les dispos repartent de zéro.</p>`],
  ['dispos','Mes dispos',`<p>Touche un jour : une fois = dispo (vert), deux = indispo (rouge barré), trois = effacé. « Tout dispo » coche tous les jours non renseignés. Les jours où toute l’équipe est dispo passent en or. Le calendrier commence au plus tôt un mois après la dernière pesée et couvre 28 jours. Répondre avant la pesée débloque le défi Présent à l’appel.</p>`],
  ['reponses','Réponses',`<p>Qui a répondu et qui n’a pas encore donné ses dispos. Tant que tout le monde n’a pas répondu, les « meilleurs jours » sont indicatifs.</p>`],
  ['tous-dispo','Tout le monde est dispo',`<p>Les jours en or : toute l’équipe a dit dispo. Touche « Fixer » pour retenir la date.</p>`],
  ['meilleurs','Meilleurs jours',`<p>Les jours classés par nombre de dispos, puis par nombre d’indispos, puis par date. Utile quand personne n’est libre le même jour.</p>`],
  ['moi-equipe','Moi vs l’équipe',`<p>Ton rang sur chaque stat parmi ceux qui l’ont mesurée, et le meilleur de l’équipe.</p>`],
  ['bmr','Métabolisme de base',`<p>Le métabolisme mesuré par la Tanita comparé à celui prédit pour ton âge, ta taille et ton poids (formule de Mifflin-St Jeor). Au-dessus du prédit = plus de masse maigre que la moyenne de ton gabarit. C’est ce rapport qui fait l’attribut Moteur.</p>`],
  ['surveiller','À surveiller',`<p>Les stats où tu es dans une zone à risque d’après les références (gras, viscérale, tour de taille…), avec la cible pour en sortir.</p>`],
  ['grades','Grades',`<p>Argent : gras 20 % max, c’est tout (« plus gros »). Or : note 65, gras 15 % max, indice 20 min, viscérale 7 max. Diamant : note 80, gras 12 % max, indice 21 min, viscérale 4 max. Légende : note 85, gras 10 % max, indice 22 min, viscérale 2 max. Un mois sans pesée fait descendre d’un grade. L’indice musculaire = masse musculaire Tanita ÷ taille².</p>`],
  ['attributs','Lecture des attributs',`<p>Chaque attribut va de 20 à 99. Puissance : indice 18 = 40, 24 = 90. Sèche : 25 % = 40, 10 % = 90. Moteur : métabolisme égal au prédit = 50, +10 % = 80. Équilibre : écart gauche-droite nul et rapport bras / jambes à 0,40 = 99. Santé : viscérale ≤ 5 et eau 55 à 65 %. Tronc : gras du tronc 12 % = 90, 30 % = 40. La note globale pondère Puissance et Sèche à 25 % chacune, les quatre autres à 12,5 %.</p>`],
  ['classement-saison','Classement et saison',`<p>Points de progression depuis le point de départ : 4 par kilo de gras perdu, 6 par kilo de muscle pris, 3 par kilo perdu sans analyse. Saison de 3 mois, champion à la clôture, dernière pesée = nouveau point de départ.</p>`],
  ['ceinture-trophees','Ceinture SPC et trophées',`<p>Ceinture remise en jeu chaque mois au meilleur gain de points. Poids lourd = plus grosse prise de muscle, Poids plume = plus grosse perte de gras, KFC = gras le mieux conservé (pire évolution), BK = gras du tronc le plus haut.</p>`],
  ['objectifs-regles','Objectifs',`<p>Une cible par stat, verrouillée après validation, évaluée à la pesée, remise à zéro ensuite. Badges à 1, 2, 5 objectifs atteints en un mois, tous atteints (5 minimum), et un badge pour les ratés.</p>`],
  ['badges-regles','Badges',`<p>96 défis en quatre raretés : commun (badge seul), rare (contour ou titre), épique (cadre ou motif animé), légendaire (thème). Acquis pour toujours sauf les grades. La liste complète est dans Profil.</p>`],
  ['qui-saisit','Qui saisit',`<p>Seul l’admin saisit et corrige les pesées, depuis le ticket de la balance, pour qu’aucun chiffre ne soit arrangé. Chacun gère son profil, ses objectifs, ses dispos et ses cosmétiques.</p>`],
  ['protocole','Protocole de pesée',`<p>Mêmes conditions pour tout le monde : le matin, à jeun, vessie vide, sans sport la veille au soir, même balance. Une pesée par mois, idéalement le même jour pour tous. Les écarts d’hydratation faussent le muscle Tanita de ± 0,5 kg.</p>`],
  ['radar-attr','Radar des attributs',`<p>Les six attributs des deux participants superposés. La surface la plus grande gagne l’œil, mais regarde surtout où les deux formes diffèrent.</p>`],
  ['balance','Balance',`<p>Le poids total, obligatoire. Tout le reste est facultatif mais sans analyse Tanita il n’y a ni note, ni attributs, ni gras pour les trophées.</p>`],
  ['tanita','Analyse Tanita',`<p>Gras %, muscle kg, eau %, viscérale (indice 1 à 59, sain jusqu’à 12), métabolisme de base (kcal), âge métabolique, masse osseuse. Recopie le ticket dans l’ordre.</p>`],
  ['muscle-zone','Muscle par zone',`<p>La masse musculaire de chaque segment en kilos. La somme fait la masse musculaire totale.</p>`],
  ['gras-zone','Gras par zone',`<p>Le % de gras de chaque segment. Le tronc sert au BK et à l’attribut Tronc.</p>`],
  ['charges','Charges machines',`<p>Les charges EGYM par machine en kilos. Elles ont leur historique, leurs objectifs et leurs défis.</p>`],
  ['infos','Mes infos',`<p>Prénom ou pseudo, date de naissance (pour l’âge et les références), sexe, taille (pour l’indice musculaire et l’IMC), objectif principal, et le compte (e-mail) avec lequel tu te connectes. Enregistrer sauvegarde tout ; Changer mon mot de passe en demande un nouveau ; Se déconnecter revient à l’écran de connexion.</p>`],
  ['admin','Zone admin',`<p>Réservée à l’admin : saisir ou modifier une pesée, régler les hors concours, sauvegarder toutes les données dans un fichier, ou envoyer une sauvegarde au serveur partagé. Les données sont communes à tous les participants et mises à jour en direct.</p>`],
  ['hors','Hors concours',`<p>Un participant hors concours reste dans tous les classements et trophées ; seul le bloc « Le plus sec » de l’accueil affiche en plus le premier des autres quand il est devant.</p>`],
  ['sauvegarde','Sauvegarde',`<p>Exporte toutes les données en fichier .json (profils, pesées, objectifs, photos, cosmétiques) et les restaure depuis un fichier. À faire avant toute réinitialisation.</p>`],
  ['goals','Mes cibles',`<p>Actuel = dernière mesure. Proposé = pas mensuel réaliste selon ton objectif principal (perte de gras : -2 % du poids en gras ; prise de muscle : +0,6 kg ; recomposition : -1 kg de gras et +0,3 kg de muscle), touche-le pour le prendre. Ma cible = ta valeur. Les stats liées se remplissent en pointillé. Vide = pas d’objectif.</p>`],
  ['evo-tuiles','Tuiles d’évolution',`<p>L’écart entre ta première et ta dernière mesure de chaque stat. Vert = bon sens, orange = mauvais sens, gris = pas encore deux mesures. Touche une tuile pour mettre la courbe dessus.</p>`],
  ['courbe','Courbe',`<p>La stat choisie au fil des mois. « Toute l’équipe » superpose tout le monde, toi en doré. Les puces et le menu changent la stat.</p>`],
  ['photo-profil','Photo de profil',`<p>Se débloque à la première pesée. Elle remplit le cercle de ta carte à la place de tes initiales, recadrée en carré. Masquer la cache sans l’effacer. Mettre sa photo débloque le défi Visage découvert.</p>`],
  ['epingles','Badges épinglés',`<p>Jusqu’à trois badges débloqués affichés sous ton nom : une étiquette avec le nom pour un seul, des pastilles rondes pour deux ou trois. L’ordre d’épinglage fait l’ordre d’affichage. Les verrouillés se visualisent mais ne s’épinglent pas.</p<p>Un point doré qui pulse, ou l’étiquette « Nouveau », signale un badge ou un cosmétique gagné que tu n’as pas encore ouvert ; le chiffre rouge sur l’onglet Profil en compte le nombre. Ouvrir sa fiche le marque comme vu, « Tout vu » efface tout d’un coup.</p>`],
  ['contour','Contour de carte',`<p>Le liseré autour de la carte. Du grade par défaut ; les autres se débloquent par des défis (commun à légendaire). Les légendaires tournent. Touche une case pour la fiche et le bouton Équiper.</p>`],
  ['titre','Titre honorifique',`<p>Un texte sous ton nom, gagné par les trophées et les défis. « Tenant de la ceinture » n’est disponible que tant que tu la portes.</p>`],
  ['cadre','Cadre d’avatar',`<p>Un anneau, une couronne, des flammes, des étincelles… autour de tes initiales ou de ta photo. Les cadres des paliers de performance ont une forme dessinée (clous, lauriers, pointes, flammes…), animée aux deux derniers paliers.</p>`],
  ['forme-carte','Forme de la carte',`<p>La découpe de ta carte entière : pointes (celle de base), bouclier (Carte Argent), écusson (Carte Or), bannière (Premier titre), octogone (3 mois d’affilée), coins biseautés (Fiche complète), ticket (Présent), arche (Première pesée). Le contour suit la forme, le contenu ne bouge pas.</p>`],
  ['forme-avatar','Forme de l’avatar',`<p>La découpe de ta photo ou de tes initiales : rond, carré arrondi, hexagone, écusson, losange, octogone, étoile, goutte, bouclier, cœur. Chaque forme se gagne avec un défi ou un grade de carte ; le cadre se dessine autour de la forme.</p>`],
  ['motif','Motif de fond',`<p>Une texture par-dessus la couleur du grade : carbone, marbre, rayures, holographique… Les épiques et légendaires sont animés.</p>`],
  ['theme','Thème de l’appli',`<p>Les couleurs de toute l’interface, sur ton téléphone. Les faciles sont volontairement un peu nuls (Gris béton, Rose bonbon, Mode gras) ; les beaux sont légendaires. « Doré » n’est disponible que tant que tu portes la ceinture.</p>`],
  ['etoiles','Étoiles',`<p>Une étoile sur la carte par mois avec la ceinture SPC, cinq maximum. Automatique, pas à équiper.</p>`],
  ['ma-vitrine','Ma vitrine',`<p>Tes compteurs : ceintures, Poids lourd, Poids plume, KFC, BK.</p>`],
  ['defis','Mes défis',`<p>Tous les défis par rareté, les débloqués en premier. Touche un défi pour sa fiche : description, condition, récompense, rendu sur ta carte. « Voir tous » affiche les verrouillés ; « Visualiser » montre un verrouillé sur ta carte.</p>`],
  ['badges-equipe','Badges de l’équipe',`<p>Le nombre de badges débloqués par chaque participant. Touche un nom pour sa carte.</p>`],
  ['test','Mode test',`<p>Admin seulement : débloque tout sur ton profil pour voir le rendu. Rien n’est gagné pour de vrai ; « Fin du test » remet tout en place.</p>`],
  ['pesees-mois','Pesées du mois',`<p>Combien de participants se sont déjà pesés ce mois-ci et qui manque encore. Les pesées sont saisies par l’admin après le passage sur la balance.</p>`],
  ['silhouette','Silhouette',`<p>Le corps en cinq zones (tronc, bras, jambes) colorées selon l’évolution du mois : vert = la zone a progressé (muscle en hausse ou gras en baisse), orange = elle a reculé, gris = pas de comparaison possible. Touche une zone pour son historique.</p>`],
  ['note-attributs','Note et attributs',`<p>La note globale (sur 99) pondère Puissance et Sèche à 25 % chacune et les quatre autres attributs à 12,5 %. Elle n’existe qu’avec une analyse Tanita complète. Chaque attribut va de 20 à 99 ; 100 n’est pas atteignable, c’est voulu.</p>`],
  ['stat-courbe','Courbe de la stat',`<p>La valeur à chaque pesée, et l’objectif en pointillé doré s’il est fixé. L’échelle s’adapte aux valeurs.</p>`],
  ['compare-table','Face à face par stat',`<p>Chaque stat des deux participants côte à côte, par groupe (global, carte, mesures…). Le meilleur des deux est en couleur ; une stat absente chez l’un affiche un point.</p>`],
  ['records-liste','Records',`<p>Chaque ligne : le record, qui le détient, la valeur et le mois. Touche une ligne pour la carte du détenteur.</p>`],
  ['moyenne-perfs','Performances vs la population',`<p>Chaque record (pompes, VO2max, pouls au repos, développé couché, 5 et 10 km, test de Cooper, gainage, tractions) est placé sur l’échelle des références publiées pour ton âge et ton sexe : « mieux que X % » ou catégorie. La source est indiquée sous chaque jauge ; quand la référence est faible (petite étude, jeunes) c’est dit. Les exercices sans norme fiable (burpees, muscle-ups, escaliers…) n’apparaissent pas.</p>`],
  ['moyenne-stat','Jauge',`<p>Ta valeur sur l’échelle des références de ton âge et de ton sexe : la zone où tu es, et la cible pour passer dans la suivante.</p>`],
  ['raccourci-perfs','Perfs et machines',`<p>Tes paliers (pompes, tractions…) et tes max machines ont déménagé dans l’onglet Perfs, où ils sont rangés avec les records de toute l’équipe. Touche ce panneau pour y aller.</p>`]
];
const HELP_FALLBACK={stat:'stat-courbe',moyenne:'moyenne-stat',compare:'compare-table',evolution:'courbe',records:'records-liste'};
function helpFor(text){ text=(text||'').replace(/\s+/g,' ').trim(); if(!text) return null; let best=null; for(const [id,pre,body] of HELP_SECTIONS){ if(text.startsWith(pre)&&(!best||pre.length>best[1].length)) best=[id,pre,body]; } return best; }
function injectHelp(){ try{
  const app=document.getElementById('app'); if(!app) return;
  // encarts
  const els=app.querySelectorAll('.panel,.belt-panel,.trophy,[data-help]');
  els.forEach(el=>{ if(el.querySelector(':scope>.hq')) return; let h=null;
    if(el.dataset.help){ const f=HELP_SECTIONS.find(x=>x[0]===el.dataset.help); if(f) h=f; }
    else { const st=el.querySelector('.section-title,.eyebrow'); if(st) h=helpFor(st.textContent); }
    if(!h&&HELP_FALLBACK[state.screen]){ h=HELP_SECTIONS.find(x=>x[0]===HELP_FALLBACK[state.screen]); }

  const best=(label,unit,icon,color,pick,fmtv)=>{let b=null; for(const p of DB.profiles){ for(const wi of weighinsOf(p.id)){ const v=pick(wi,p); if(v==null) continue; if(!b||v.better(b.v)) b={v:v.v,better:v.better,p,mois:wi.mois}; } } if(b) recs.push({label,unit,icon,color,p:b.p,mois:b.mois,val:fmtv(b.v)}); };
  const lower=(x)=>({v:x,better:(o)=>x<o}), higher=(x)=>({v:x,better:(o)=>x>o});
  best('Gras le plus bas','%','flame','#FF9F43',(w)=>w.gras==null?null:lower(w.gras),v=>fr(v));
  best('Indice musculaire le plus haut','','dumbbell','#FF6B6B',(w,p)=>w.muscle==null?null:higher(w.muscle/((p.taille/100)**2)),v=>fr(v));
  best('Note globale la plus haute','','card','#D9AE4A',(w,p)=>{const a=attrs(p,w);return a&&a.overall!=null?higher(a.overall):null;},v=>v);
  best('Viscérale la plus basse','','target','#B89CFF',(w)=>w.visc==null?null:lower(w.visc),v=>v);
  best('Eau la plus haute','%','droplet','#4ECDC4',(w)=>w.eau==null?null:higher(w.eau),v=>fr(v));
  best('Plus gros tour de bras','cm','ruler','#C3C8CE',(w)=>w.mens&&w.mens.bras!=null?higher(w.mens.bras):null,v=>fr(v));
  best('Presse à cuisses','kg','dumbbell','#FF6B6B',(w)=>w.egym&&w.egym.presse!=null?higher(w.egym.presse):null,v=>v);
  best('Tirage vertical','kg','dumbbell','#FF6B6B',(w)=>w.egym&&w.egym.tirageV!=null?higher(w.egym.tirageV):null,v=>v);
  best('BioAge le plus jeune','ans','calendar','#B89CFF',(w)=>w.egym&&w.egym.bioAge!=null?lower(w.egym.bioAge):null,v=>v);
  let bf=null,bm=null; for(const p of DB.profiles){ for(const d of monthDeltas(p)){ if(!bf||d.fat>bf.v) bf={v:d.fat,p,mois:d.mois}; if(!bm||d.mus>bm.v) bm={v:d.mus,p,mois:d.mois}; } }
  if(bf&&bf.v>0) recs.push({label:'Plus grosse perte de gras sur un mois',unit:'kg',icon:'flame',color:'#FF9F43',p:bf.p,mois:bf.mois,val:fr(bf.v)});
  if(bm&&bm.v>0) recs.push({label:'Plus gros gain de muscle sur un mois',unit:'kg',icon:'dumbbell',color:'#FF6B6B',p:bm.p,mois:bm.mois,val:fr(bm.v)});
  return `<div class="screen"><div class="topbar"><button class="btn" data-go="classement" aria-label="Retour" style="width:44px;padding:0">${svg('back',20,2)}</button><div style="text-align:center"><div class="eyebrow">Toutes saisons</div><div style="font-weight:600">Records de l’équipe</div></div><span style="width:44px"></span></div>
  <div data-help="records-liste" style="display:flex;flex-direction:column;gap:8px;position:relative;padding-top:28px">${recs.map(r=>`<button class="rank-row" data-go="carte" data-id="${r.p.id}"><span class="ic" style="width:36px;height:36px;border-radius:10px;background:${r.color}26;color:${r.color};display:flex;align-items:center;justify-content:center;flex:none">${svg(r.icon,18,2.2)}</span><span style="flex:1;min-width:0"><div style="font-weight:600">${r.label}</div><div class="muted" style="font-size:11px">${esc(r.p.prenom)} · ${monthLabel(r.mois)}</div></span><span class="pts num" style="color:${r.color}">${r.val} <span style="font-size:11px;color:var(--muted)">${r.unit}</span></span></button>`).join('')||'<div class="muted">Pas encore de record.</div>'}</div></div>`;
}
function screenRegles(){
  return `<div class="screen"><div class="topbar"><button class="btn" data-go="potes" aria-label="Retour" style="width:44px;padding:0">${svg('back',20,2)}</button><div style="text-align:center"><div class="eyebrow">${season().name}</div><div style="font-weight:600">Règles du jeu</div></div><span style="width:44px"></span></div>
  <div class="panel"><div class="section-title" style="margin-bottom:8px">Protocole de pesée</div><div style="font-size:14px;line-height:1.5">Une pesée par mois, sur la même balance (Tanita de la salle, réglage Standard, Homme, taille à jour). Le matin ou avant la séance, à jeun depuis 3 heures, après être passé aux toilettes, pieds nus. Mètre ruban le même jour, côté droit, bras relâché, taille au nombril. Une pesée faite n’importe comment fausse toute la courbe.</div></div>
  <div class="panel"><div class="section-title" style="margin-bottom:8px">Grades</div><div style="font-size:14px;line-height:1.6">
    <div><strong style="color:#E8B98A">Bronze</strong> : par défaut.</div>
    <div><strong style="color:#F2F4F6">Argent</strong> : gras 20 % max, rien d’autre : le grade « plus gros ».</div>
    <div><strong style="color:var(--gold2)">Or</strong> : note 65, gras 15 % max, indice 20 min, viscérale 7 max.</div>
    <div><strong style="color:#7FE3FF">Diamant</strong> : note 80, gras 12 % max, indice 21 min, viscérale 4 max.</div>
    <div><strong style="color:var(--violet)">Légende</strong> : note 85, gras 10 % max, indice 22 min, viscérale 2 max.</div>
    <div class="muted" style="font-size:12px;margin-top:6px">Indice musculaire = masse musculaire Tanita en kg divisée par la taille en mètres au carré. Il ne dépend pas du gras : perdre du gras ne le fait pas monter, seul le muscle compte. Repères hommes : 16-17 sédentaire, 18-19 sportif, 20-21 très développé, 22 et plus exceptionnel. Un mois sans pesée : un grade en moins jusqu’à la pesée suivante.</div></div></div>
  <div class="panel"><div class="section-title" style="margin-bottom:8px">Note et attributs</div><div style="font-size:14px;line-height:1.6">
    ${ATTR_META.map(m=>`<div><strong style="color:${m.color}">${m.name}</strong> <span class="muted">· ${m.help}</span></div>`).join('')}
    <div class="muted" style="font-size:12px;margin-top:6px">Note globale : Puissance et Sèche comptent 25 % chacune, les quatre autres 12,5 %. Un attribut non mesurable est ignoré sans pénalité. La régularité ne note pas la carte : un mois sans pesée suspend le grade, et les badges 3, 6 et 12 mois la récompensent.</div></div></div>
  <div class="panel"><div class="section-title" style="margin-bottom:8px">Classement et saison</div><div style="font-size:14px;line-height:1.5">Le classement se joue sur la progression par rapport à soi-même depuis le point de départ : 4 points par kilo de gras perdu, 6 points par kilo de muscle pris, ou 3 points par kilo perdu tant que le départ n’a que le poids. Une saison dure 3 mois. Le champion de la saison est celui qui a le plus de points à la clôture ; il entre au palmarès et sa carte le mentionne. La dernière pesée de chacun devient le point de départ de la saison suivante.</div></div>
  <div class="panel"><div class="section-title" style="margin-bottom:8px">Qui saisit</div><div style="font-size:14px;line-height:1.5">Les pesées sont saisies et corrigées par l’admin (${esc((DB.profiles.find(p=>p.admin)||{}).prenom||'·')}) depuis le ticket de la balance, pour que personne ne puisse fausser ses chiffres. Chacun gère son profil, ses objectifs et ses dispos.</div></div>
  <div class="panel"><div class="section-title" style="margin-bottom:8px">Objectifs</div><div style="font-size:14px;line-height:1.5">Chacun fixe ses objectifs pour la pesée à venir depuis son profil, sur n’importe quelle stat, puis les valide. Une fois validés, ils sont verrouillés. À la pesée, ils sont évalués (atteint ou raté), le bilan reste sur la carte, et la liste est remise à zéro pour le mois suivant.</div></div>
  <div class="panel"><div class="section-title" style="margin-bottom:8px">Ceinture SPC et trophées</div><div style="font-size:14px;line-height:1.5">La ceinture SurPoids Championship est remise en jeu chaque mois : elle va au meilleur gain de points du mois, et le tenant la garde si personne n’a deux pesées. Trophées du mois : Poids lourd pour la plus grosse prise de muscle, Poids plume pour la plus grosse perte de gras, KFC (Kilos Franchement Conservés) pour celui qui a le mieux conservé son gras (pire évolution du gras en kilos entre deux analyses), BK (Bide King) pour le gras du tronc le plus haut.</div></div>
  <div class="panel"><div class="section-title" style="margin-bottom:8px">Performances</div><div style="font-size:14px;line-height:1.5">Quarante-trois exercices (pompes, tractions, gainage, squats, dips, course, vélo, rameur, natation, squat barre, soulevé de terre, etc.) avec cinq paliers chacun : Bronze, Argent, Or (difficile), Diamant (très difficile), Légende (extrême). Les tests se font le jour de la pesée devant les autres et sont saisis par l’admin ; chaque palier atteint reste acquis et donne un badge, puis un titre, un contour, un cadre ou motif animé et un thème selon le palier. Le détail des standards et des paliers est dans l’onglet Profil, section Performances.</div></div>
  <div class="panel"><div class="section-title" style="margin-bottom:8px">Badges</div><div style="font-size:14px;line-height:1.6">${(DB.profiles[0]?badgesOf(DB.profiles[0]):[]).filter(x=>!x.perf&&!x.secret).map(x=>`<div><strong>${x.name}</strong> <span class="muted">· ${x.desc}</span></div>`).join('')}</div></div>
  </div>`;
}
function screenCompare(me){
  const A=profile(state.compA)||me, B=profile(state.compB)||DB.profiles.find(p=>p.id!==A.id)||A;
  const wa=lastOf(A.id), wb=lastOf(B.id);
  const sel=(id,cur)=>`<select id="${id}">${DB.profiles.map(p=>`<option value="${p.id}" ${p.id===cur.id?'selected':''}>${esc(p.prenom)}</option>`).join('')}</select>`;
  const rows=METRIC_GROUPS.map(([g,ks])=>{const items=ks.map(k=>{const m=METRICS[k];const va=wa?m.get(wa,A):null, vb=wb?m.get(wb,B):null; if(va==null&&vb==null) return '';
      let wa_=false,wb_=false; if(va!=null&&vb!=null&&va!==vb&&m.good!=='none'){wa_= m.good==='down'?va<vb:va>vb; wb_=!wa_;}
      return `<div class="zone-row"><span style="flex:1;color:#C3C8CE;font-size:12px">${m.label}${m.unit?' <span class="muted">('+m.unit+')</span>':''}</span><span class="num" style="width:64px;text-align:right;font-family:var(--display);font-weight:700;font-size:15px;color:${wa_?'var(--green)':'var(--fg)'}">${va==null?'·':fr(va,m.d)}</span><span class="num" style="width:64px;text-align:right;font-family:var(--display);font-weight:700;font-size:15px;color:${wb_?'var(--green)':'var(--fg)'}">${vb==null?'·':fr(vb,m.d)}</span></div>`;}).filter(Boolean).join('');
    return items?`<div class="panel"><div class="section-title" style="margin-bottom:6px">${g}</div>${items}</div>`:'';}).join('');
  return `<div class="screen"><div class="topbar"><button class="btn" data-go="potes" aria-label="Retour" style="width:44px;padding:0">${svg('back',20,2)}</button><div style="text-align:center"><div class="eyebrow">Face à face</div><div style="font-weight:600">${esc(A.prenom)} · ${esc(B.prenom)}</div></div><span style="width:44px"></span></div>
  <div class="field-row"><label>Joueur 1${sel('cmpA',A)}</label><label>Joueur 2${sel('cmpB',B)}</label></div>
  <div class="row" style="justify-content:space-between"><span class="chip">${wa?'Pesée de '+monthLabel(wa.mois):'Aucune pesée'}</span><span class="chip">${wb?'Pesée de '+monthLabel(wb.mois):'Aucune pesée'}</span></div>
  ${(()=>{const aa=attrs(A,wa), ab=attrs(B,wb); if(!aa||!ab||!aa.tanita||!ab.tanita) return '<div class="panel muted" style="font-size:13px">Radar disponible quand les deux ont une pesée complète.</div>';
    return `<div class="panel"><div class="section-title" style="margin-bottom:4px">Radar des attributs</div>${radarSvg([{list:aa.list,color:'#D9AE4A'},{list:ab.list,color:'#5EC2FF'}],240)}<div class="legend" style="justify-content:center;margin-top:4px"><span class="row" style="gap:5px"><span class="dot" style="width:10px;height:10px;background:#D9AE4A"></span>${esc(A.prenom)} · ${aa.overall}</span><span class="row" style="gap:5px"><span class="dot" style="width:10px;height:10px;background:#5EC2FF"></span>${esc(B.prenom)} · ${ab.overall}</span></div></div>`;})()}
  <div class="muted" style="font-size:12px">En vert : la meilleure valeur des deux, dans le sens de l’objectif de la stat.</div>
  ${rows}</div>`;
}

function goalsReadonly(p){ // objectifs d'un participant, en lecture

function lineChart(series, months, fmt, goal){
  const W=440,H=220,L=40,R=12,T=14,B=30;
  const all=series.flatMap(s=>s.values.filter(v=>v!=null)); if(goal!=null) all.push(goal);
  if(!all.length) return '<div class="muted">Pas de données.</div>';
  let min=Math.min(...all), max=Math.max(...all); const pad=(max-min)*.15||1; min-=pad; max+=pad;
  const x=i=>L+(months.length===1?(W-L-R)/2:i*(W-L-R)/(months.length-1)), y=v=>T+(max-v)*(H-T-B)/(max-min);
  const ticks=4, tk=[...Array(ticks+1)].map((_,i)=>min+(max-min)*i/ticks);
  const grid=tk.map(v=>`<line x1="${L}" x2="${W-R}" y1="${y(v).toFixed(1)}" y2="${y(v).toFixed(1)}" stroke="#2A2F36" stroke-width="1"/><text x="${L-6}" y="${(y(v)+4).toFixed(1)}" text-anchor="end" font-size="11" fill="#9AA1A9" font-family="Barlow,sans-serif">${fmt(v)}</text>`).join('');
  const xl=months.map((m,i)=>`<text x="${x(i).toFixed(1)}" y="${H-8}" text-anchor="middle" font-size="11" fill="#9AA1A9" font-family="Barlow,sans-serif">${monthLabel(m)}</text>`).join('');
  const lines=series.map(s=>{const pts=s.values.map((v,i)=>v==null?null:[x(i),y(v)]).filter(Boolean);
    const d=pts.map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' ');
    const last=pts[pts.length-1];

function monthPoints(p, mois){ // progression entre la pesée précédente et celle du mois
  const l=weighinsOf(p.id); const cur=l.find(x=>x.mois===mois); if(!cur) return null;
  const prev=l.filter(x=>x.mois<mois).slice(-1)[0]; if(!prev) return null;
  if(cur.gras!=null&&prev.gras!=null&&cur.muscle!=null&&prev.muscle!=null) return {pts:(fatKg(prev)-fatKg(cur))*4+(cur.muscle-prev.muscle)*6, fat:fatKg(prev)-fatKg(cur), mus:cur.muscle-prev.muscle, kg:cur.poids-prev.poids};
  return {pts:(prev.poids-cur.poids)*3, fat:null, mus:null, kg:cur.poids-prev.poids};
}
function beltHistory(){ // ceinture SPC : remise en jeu chaque mois, au meilleur du mois, conservée si personne ne s'est pesé deux fois
  const first=allMonths()[0]; if(!first) return [];
  const months=monthsBetween(first,allMonths().slice(-1)[0]), out=[]; let holder=null;
  for(const m of months){ let best=null;
    for(const p of DB.profiles){ const r=monthPoints(p,m); if(r&&(!best||r.pts>best.pts)) best={p,pts:r.pts}; }
    if(best){ const kept=holder&&holder.id===best.p.id; holder=best.p; out.push({mois:m,holder:best.p,pts:Math.round(best.pts),how:kept?'conservée':'prise'}); }
    else if(holder) out.push({mois:m,holder,pts:null,how:'conservée (pas de challenger)'});
  }
  return out;
}
function beltNow(){ const h=beltHistory(); return h.length?h[h.length-1]:null; }
function trophiesOf(mois){ // trophées moqueurs du mois
  let kfc=null, bk=null, lourd=null, plume=null, nCand=0;
  for(const p of DB.profiles){ const r=monthPoints(p,mois); // pire évolution de gras du mois, uniquement entre deux analyses Tanita : il a conservé pendant que les autres perdaient
    if(r&&r.fat!=null){ nCand++; const g=-r.fat; if(!kfc||g>kfc.v) kfc={p,v:g,mode:'gras'};

function claimCompute(c){ const v=c.votes||{}; const voters=claimVoters(c); if(!voters.length) return 'pending'; if(voters.some(q=>q.arbitre&&v[q.id]==='ok')) return 'ok'; const ok=voters.filter(q=>v[q.id]==='ok').length, no=voters.filter(q=>v[q.id]==='no').length, need=claimNeed(c); if(ok>=need) return 'ok'; if(no>=need) return 'no'; return 'pending'; }

function perfEventsOf(me,pid){ if(!me||pid===me.id) return []; const p=profile(pid); if(!p) return []; const seen=new Set(((me.flags||{}).seenPerf)||[]); const out=[]; const kg=new Set(EGYM.filter(x=>x[2]==='kg').map(x=>x[0]));

async function claimFileData(f){ // photo : réduite en jpeg ; vidéo : telle quelle
  if(f.type.startsWith('image/')){ const img=new Image(); const url=URL.createObjectURL(f); await new Promise((res,rej)=>{img.onload=res;img.onerror=rej;img.src=url;}); const max=1280, r=Math.min(1,max/Math.max(img.width,img.height)); const c=document.createElement('canvas'); c.width=Math.round(img.width*r); c.height=Math.round(img.height*r); c.getContext('2d').drawImage(img,0,0,c.width,c.height); URL.revokeObjectURL(url); const blob=await new Promise(res=>c.toBlob(res,'image/jpeg',.8)); return {blob,type:'image',ext:'jpg'}; }

const alertDot=(n,title)=>n?`<span class="navdot" title="${esc(title||'')}">${n}</span>`:'';

  add(/Carte (Argent|Or|Diamant|Légende)|grade/i,'Grades : Argent = gras 20 % max. Or = note 65, gras 15 % max, indice 20, viscérale 7 max. Diamant = note 80, gras 12 % max, indice 21, viscérale 4 max. Légende = note 85, gras 10 % max, indice 22, viscérale 2 max. Un grade se perd si on ne tient plus ses seuils.');

  if(!out.length) out.push('Rien à déclarer : c’est vérifié automatiquement à chaque pesée saisie par l’admin, et le badge tombe dès que la condition est remplie.');
  return out.join(' '); }
function previewSheet(me, opts){ // aperçu d'un défi ou d'un cosmétique verrouillé sur ma carte

  // on part de la carte telle qu'elle est vraiment (cosmétiques effectifs, pas les réglages d'un ancien test), puis on ajoute l'élément à visualiser
  const eff={}; for(const k of Object.keys(COSM)) eff[k]=cosmOf(me,k).id; eff.badges=pinnedBadges(me).map(b=>b.id); eff.avatarOff=(me.equip||{}).avatarOff;
  const fake=Object.assign({},me,{testUnlock:true,equip:eff}); let title='', desc='', theme=null, rar='commun';
  if(opts.devise){ rar='rare'; fake.devise=me.devise||'Ma devise ici'; title=`<span class="rar-rare">Devise</span>`; desc=`<strong>Pour la débloquer :</strong> prendre la ceinture SPC au moins une fois (défi Ceinture SPC). Ensuite tu écris la phrase que tu veux, 30 caractères, elle s’affiche sous ton titre.${deviseUnlocked(me)?' <span style="color:var(--green)">Débloquée.</span>':' Pas encore débloquée, voici l’aperçu sur ta carte.'}`; }
  else if(opts.badge){ const b=badgesOf(me).find(x=>x.id===opts.badge); if(!b) return; rar=b.rar||'commun'; fake.equip.badges=[b.id,...eff.badges.filter(x=>x!==b.id)].slice(0,3); if(b.id==='belt1') fake.devise=me.devise||'Ma devise ici';
    for(const k of Object.keys(COSM)) for(const it of COSM[k]) if(it.badge===b.id){ if(k==='theme') theme=it; else fake.equip[k]=it.id; }
    title=`<span style="color:${b.color}">${svg(b.icon,20,2.4)}</span> <span class="rar-${rar}">${b.name}</span>`; desc=`<strong>Le défi :</strong> ${b.desc}.${b.reward?' <strong>Récompense :</strong> '+b.reward+'.':' Badge seul, sans cosmétique.'}${b.ok?' <span style="color:var(--green)">Débloqué.</span>':' Pas encore débloqué, voici ce que ça donnerait sur ta carte'+(theme?' et dans l’appli':'')+'.'}${badgeHow(b)?`<div class="muted" style="font-size:12.5px;margin-top:6px"><strong>Concrètement :</strong> ${badgeHow(b)}</div>`:''}`; }
  else { const it=(COSM[opts.kind]||[]).find(x=>x.id===opts.id); if(!it) return; rar=it.rar||'commun'; if(opts.kind==='theme') theme=it; else fake.equip[opts.kind]=it.id;
    title=`<span class="rar-${rar}">${it.name}</span>`; const bb=it.badge?badgesOf(me).find(x=>x.id===it.badge):null;
    desc=`<strong>Pour le débloquer :</strong> ${bb?`défi « ${bb.name} » : ${bb.desc}`:it.cond}.${unlockOk(me,it)?' <span style="color:var(--green)">Débloqué.</span>':' Pas encore débloqué, voici l’aperçu sur ta carte.'}${(bb?badgeHow(bb):/grade/i.test(it.cond)?badgeHow({desc:'grade'}):'')?`<div class="muted" style="font-size:12.5px;margin-top:6px"><strong>Concrètement :</strong> ${bb?badgeHow(bb):badgeHow({desc:'grade'})}</div>`:''}`; }
  const r=RARITY[rar]; const wi=lastOf(me.id), a=attrs(me,wi);
  // deux cartes superposées : la carte actuelle dessous, la carte avec l'élément dessus qui apparaît et disparaît
  const base=Object.assign({},me,{testUnlock:false,equip:Object.assign({},me.equip||{})});
  const body=`<div>${desc}</div><div style="position:relative;transform:scale(.78);transform-origin:top center;margin:8px 0 -86px"><div style="position:absolute;inset:0">${bigCard(base,wi,a)}</div><div class="blinkcard" style="position:relative">${bigCard(fake,wi,a)}</div></div>${theme?`<div class="blink-sw" style="margin-top:8px;height:34px;border-radius:10px;border:1px solid ${theme.vars['--line']||'var(--line)'};background:${theme.vars['--panel2']||'var(--panel2)'};display:flex;align-items:center;justify-content:center;font-size:12px;color:${theme.vars['--gold2']||'var(--gold2)'}">Couleurs du thème ${theme.name}</div>`:''}`;
  const item=!opts.badge&&!opts.devise?(COSM[opts.kind]||[]).find(x=>x.id===opts.id):null; const canEquip=!!item&&unlockOk(me,item); const isOn=!!item&&cosmOf(me,opts.kind).id===item.id;
  const bd=opts.badge?badgesOf(me).find(x=>x.id===opts.badge):null; const pinOn=!!(bd&&((me.equip||{}).badges||[]).includes(bd.id)); const pinBtn=bd&&(bd.ok||me.testUnlock)&&me.id===ME?`<button class="btn small ${pinOn?'ghost':''}" data-act="pin-badge" data-id="${bd.id}" data-sheet-close>${pinOn?'Retirer de ma carte':svg('plus',14,2.4)+' Épingler sur ma carte'}</button>`:'';
  const o=sheet(title+`<span class="rar-tag" style="color:${r.color}">${r.label}</span>`, body, pinBtn?pinBtn:canEquip?(isOn?`<span class="chip" style="border-color:var(--gold);color:var(--gold2)">${svg('check',14,2.4)} Équipé</span>`:`<button class="btn small" data-act="equip-cosm" data-kind="${opts.kind}" data-id="${opts.id}" data-sheet-close>Équiper</button>`):'');
  if(theme&&theme.vars){ const sh=o.querySelector('.sh'); for(const k of Object.keys(theme.vars)) sh.style.setProperty(k,theme.vars[k]); const note=document.createElement('div'); note.className='muted'; note.style.cssText='font-size:12px;margin-top:6px'; note.textContent='Le thème '+theme.name+' colore cette fenêtre comme il colorerait toute l’appli.'; sh.appendChild(note); }
  return o; }
function cardInfo(el){ const p=profile(el.dataset.pid); if(!p) return; const kind=el.dataset.info;
  if(kind==='attr'){ const i=+el.dataset.i, m=ATTR_META[i], code=['PUI','SEC','MOT','SYM','SAN','REG'][i], w=lastOf(p.id), a=attrs(p,w); const v=a&&a.list[i];
    const ranks=DB.profiles.map(q=>{const aq=attrs(q,lastOf(q.id));return {q,v:aq?aq.list[i]:null};}).filter(x=>x.v!=null).sort((x,y)=>y.v-x.v); const pos=ranks.findIndex(x=>x.q.id===p.id)+1;
    sheet(`${m.name} <span style="color:${m.color}">${v!=null?v:'·'}</span>`, `${m.help}.${v!=null?` ${esc(p.prenom)} est ${pos}${pos===1?'er':'e'} sur ${ranks.length} ${pos===1?'':'(meilleur : '+esc(ranks[0].q.prenom)+' '+ranks[0].v+')'}. 100 = le maximum du barème, 20 = le minimum.`:' Pas de valeur : il manque une analyse Tanita.'}`, `<button class="btn small" data-go="stat" data-id="${p.id}" data-stat="${code}" data-sheet-close>Historique</button><button class="btn small ghost" data-go="regles" data-sheet-close>Les règles</button>`); }
  else if(kind==='badge'){ const b=badgesOf(p).find(x=>x.id===el.dataset.id); if(!b) return; const r=RARITY[b.rar||'commun']; sheet(`<span style="color:${b.color}">${svg(b.icon,20,2.4)}</span> <span class="rar-${b.rar||'commun'}">${b.name}</span><span class="rar-tag" style="color:${r.color}">${r.label}</span>`, `<strong>Le défi :</strong> ${b.desc}.${b.reward?' <strong>Récompense :</strong> '+b.reward+'.':''}${b.ok?' <span style="color:var(--green)">Débloqué par '+esc(p.prenom)+'.</span>':' Pas encore débloqué.'}${badgeHow(b)?`<div class="muted" style="font-size:12.5px;margin-top:6px"><strong>Concrètement :</strong> ${badgeHow(b)}</div>`:''}`); }
  else if(kind==='titre'){ const t=COSM.titre.find(x=>x.id===el.dataset.id); if(!t) return; const r=RARITY[t.rar||'commun']; const tb=t.badge?badgesOf(p).find(x=>x.id===t.badge):null; sheet(`<span class="rar-${t.rar||'commun'}">${t.name}</span><span class="rar-tag" style="color:${r.color}">${r.label}</span>`, `Titre honorifique. ${tb?`Défi « ${tb.name} » : ${tb.desc}.`:t.cond+'.'}${tb&&badgeHow(tb)?`<div class="muted" style="font-size:12.5px;margin-top:6px"><strong>Concrètement :</strong> ${badgeHow(tb)}</div>`:''}`); }
  else if(kind==='devise'){ sheet(`Devise de ${esc(p.prenom)}`, `<em>“${esc(deviseOf(p)||'')}”</em><div class="muted" style="font-size:12px;margin-top:6px">Phrase libre, 30 caractères, débloquée avec la première ceinture SPC. Chacun la change depuis son profil.</div>`); }
  else if(kind==='stars'){ const n=trophiesWon(p.id).belt; sheet(`${'★'.repeat(Math.min(5,n))}`, `${n} mois avec la ceinture SPC pour ${esc(p.prenom)}. Une étoile par mois, cinq maximum.`, `<button class="btn small" data-go="ceinture" data-sheet-close>Historique de la ceinture</button>`); } }

(()=>{ let sx=0, sy=0, el=null; document.addEventListener('touchstart',(e)=>{ el=e.target.closest('[data-swipe="perf"]'); if(!el||e.target.closest('video,input,textarea')){ el=null; return; } sx=e.touches[0].clientX; sy=e.touches[0].clientY; },{passive:true});
  document.addEventListener('touchend',(e)=>{ if(!el) return; const t=e.changedTouches[0]; const dx=t.clientX-sx, dy=t.clientY-sy; el=null; if(Math.abs(dx)<70||Math.abs(dy)>Math.abs(dx)*.6||document.querySelector('.sheet,.overlay')) return; const ids=DB.profiles.map(p=>p.id); const i=Math.max(0,ids.indexOf(state.perfPid||ME)); const j=dx<0?i+1:i-1; if(j<0||j>=ids.length) return; state.perfPid=ids[j]; render(); const w=document.getElementById('perf-swipe'); if(w) w.animate([{transform:`translateX(${dx<0?24:-24}px)`,opacity:.4},{transform:'none',opacity:1}],{duration:200,easing:'ease-out'}); },{passive:true}); })();
document.addEventListener('click',(e)=>{
  const hq=e.target.closest('.hq'); if(hq){e.preventDefault();e.stopPropagation();openHelp(hq.dataset.helpId);return;}
  if(e.target.closest('.brand img')){ const m=profile(ME); if(m) trackLogo(m); return; }
  if(e.target.closest('#pagehelp')){openHelp(null,true);return;}
  const inf=e.target.closest('[data-info]'); if(inf){ const go=e.target.closest('[data-go],[data-act]'); if(!go||go.contains(inf)){cardInfo(inf);return;} }
  const b=e.target.closest('[data-nav],[data-go],[data-act],[data-tab],[data-metric]'); if(!b) return;
  if(b.dataset.nav){state.screen=b.dataset.nav;state.profileId=null;if(b.dataset.nav==='objectifs')state.goalsFor=null;render();return;}
  if(b.dataset.go){state.screen=b.dataset.go;if(b.dataset.id)state.profileId=b.dataset.id;if(b.dataset.stat)state.statKey=b.dataset.stat;if(b.dataset.cmp){state.compA=ME;state.compB=b.dataset.cmp;} if(b.dataset.cmpme){state.compA=ME;state.compB=(DB.profiles.find(p=>p.id!==ME)||{}).id||null;}if(b.dataset.mois!==undefined)state.saisieMois=b.dataset.mois||null;if(b.dataset.pour)state.saisiePour=b.dataset.pour;render();return;}
  if(b.dataset.tab){state.rankTab=b.dataset.tab;render();return;}
  if(b.dataset.metric){state.evoMetric=b.dataset.metric;render();return;}
  const act=b.dataset.act;
  if(act==='login'){const id=document.getElementById('who').value,pin=document.getElementById('pin').value;const p=profile(id);
    if(p&&p.pin===pin){ME=id;try{localStorage.setItem('stats-corpo-me',id);}catch(e){}state.screen='potes';render();}
    else document.getElementById('who-err').textContent='Code incorrect. Pour la démo, le code est 1234.';}
  if(act==='logout'){ if(CLOUD.on){ cloudLogout(); return; } ME=null;try{localStorage.removeItem('stats-corpo-me');}catch(e){}state.screen='potes';render();}
  if(act==='forgot'){ const em=(document.getElementById('lg-email')||{}).value||''; cloudForgot(em.trim()).then(err=>{ cloudStatus(err); if(!err) toast('Mail envoyé à '+em.trim()+' : ouvre le lien pour choisir un nouveau mot de passe.'); }); return; }
  if(act==='change-pass'){ state.screen='newpass'; render(); return; }
  if(act==='reset'){if(!isAdmin())return;state.confirmReset=true;render();return;}
  if(act==='resetno'){state.confirmReset=false;render();return;}
  if(act==='resetyes'){if(!isAdmin())return;Store.reset();DB=Store.load();ME=null;state.confirmReset=false;state.screen='potes';render();}
  if(act==='relance'){toast('Relance envoyée aux retardataires (simulation : les notifications viendront avec la mise en ligne).');}
  if(act==='evoall'){state.evoAll=!state.evoAll;render();}
  if(act==='share'){const q=profile(b.dataset.id); if(q&&q.id===ME){q.flags=Object.assign({},q.flags||{},{share:true});Store.save(DB);} shareCard(q);}
  if(act==='avatar-toggle'){const p=profile(ME); if(!p) return; p.equip=Object.assign({},p.equip||{},{avatarOff:!(p.equip||{}).avatarOff}); Store.save(DB); render(); return;}
  if(act==='avatar-del'){const p=profile(ME); if(!p) return; delete p.avatar; Store.save(DB); render(); toast('Photo retirée.'); return;}
  if(act==='pin-badge'){const p=profile(ME); if(!p) return; if(isNewBadge(p,b.dataset.id)) markSeen(p,b.dataset.id); const e=p.equip=Object.assign({},p.equip||{}); let ids=(e.badges||(e.badge?[e.badge]:[])).slice(); delete e.badge; const id=b.dataset.id; if(ids.includes(id)) ids=ids.filter(x=>x!==id); else { if(ids.length>=3){toast('Trois badges maximum : retires-en un.');return;} ids.push(id);} e.badges=ids; Store.save(DB); render(); return;}
  if(act==='cosm-info'){const p=profile(ME); if(p){ const it=(COSM[b.dataset.kind]||[]).find(x=>x.id===b.dataset.id); const was=it&&isNewCosm(p,it); previewSheet(p,{kind:b.dataset.kind,id:b.dataset.id}); if(was){ markSeen(p,it.badge); render(); } } return;}
  if(act==='moi-show'){state.moiShow[b.dataset.k]=!state.moiShow[b.dataset.k]; render(); return;}
  if(act==='preview-badge'){const p=profile(ME); if(p){ const was=isNewBadge(p,b.dataset.id); previewSheet(p,{badge:b.dataset.id}); if(was){ markSeen(p,b.dataset.id); render(); } } return;}
  if(act==='seen-all'){const p=profile(ME); if(p){ markAllSeen(p); render(); toast('Nouveautés vues.'); } return;}
  if(act==='machines-save'){const p=profile(ME); if(!p) return; p.machines=p.machines||{}; let n=0; const today=isoDay(new Date());
    for(const m of (p.machineLog||[])) if(m.k&&m.v!=null&&(!p.machines[m.k]||p.machines[m.k].v<m.v)) p.machines[m.k]={v:m.v,date:m.date}; // la liste ne peut jamais perdre un max de l'historique

      if(isNaN(v)||v<=0) continue; /* champ vide : on ne touche à rien */ if(!o||o.v!==v){ p.machines[k]={v,date:today}; (p.machineLog=p.machineLog||[]).push({k,v,date:today}); n++; } }
    Store.save(DB); syncBadgeLog(); render(); toast(n?'Max enregistrés.':'Rien de nouveau.'); return;}

// Objectifs corrélés : quand une cible change, les stats liées suivent (gras % ↔ gras kg ↔ masse maigre, poids ↔ IMC, muscle ↔ indice, etc.)
const GOAL_LINKS=[['gras','fatkg','lean','ffmiStd'],['poids','imc','fatkg','lean','ffmiStd','eaukg'],['muscle','ffmi'],['eau','eaukg'],['t_taille','ratio'],['m_tronc','m_brasG','m_brasD','m_jambeG','m_jambeD','ratioHB']];
const GOAL_DERIVED=['fatkg','lean','imc','ffmi','ffmiStd','eaukg','ratio','ratioHB'];
function goalsSync(changed){
  const p=profile(ME); const w=lastOf(ME); if(!p||!w) return;
  const el=k=>document.getElementById('goal_'+k);
  const num=k=>{const e=el(k); if(!e) return null; const x=parseFloat(String(e.value).replace(',','.')); return isNaN(x)?null:x;};
  const h2=(p.taille/100)**2; const vals={}; for(const k of GOAL_KEYS) vals[k]=num(k);
  const poids=vals.poids??w.poids;
  // la stat saisie pilote ses jumelles
  if(changed==='fatkg'&&vals.fatkg!=null) vals.gras=vals.fatkg/poids*100;
  if(changed==='lean'&&vals.lean!=null) vals.gras=(poids-vals.lean)/poids*100;
  if(changed==='ffmiStd'&&vals.ffmiStd!=null) vals.gras=(poids-vals.ffmiStd*h2)/poids*100;
  if(changed==='SEC'&&vals.SEC!=null) vals.gras=10+(90-vals.SEC)*15/50;
  if(changed==='imc'&&vals.imc!=null) vals.poids=vals.imc*h2;
  if(changed==='ffmi'&&vals.ffmi!=null) vals.muscle=vals.ffmi*h2;
  if(changed==='PUI'&&vals.PUI!=null) vals.muscle=(18+(vals.PUI-40)*6/50)*h2;
  if(changed==='eaukg'&&vals.eaukg!=null) vals.eau=vals.eaukg/poids*100;
  if(changed==='ratio'&&vals.ratio!=null) vals.t_taille=vals.ratio*p.taille;
  if(changed==='REG'&&vals.REG!=null) vals.g_tronc=12+(90-vals.REG)*18/50;
  // muscle et gras sont liés par le poids : masse musculaire = masse maigre − (os + résidu), le résidu venant de la dernière pesée
  const bone=w.muscle!=null&&w.gras!=null?Math.max(2,w.poids-fatKg(w)-w.muscle):3; const isAuto=k=>{const e=el(k); return !e||String(e.value).trim()===''||e.classList.contains('auto');};
  const poids2=vals.poids??w.poids; let derivedMuscle=false, derivedGras=false;
  if(['poids','gras','fatkg','lean','ffmiStd','SEC','imc'].includes(changed)&&isAuto('muscle')&&isAuto('ffmi')&&isAuto('PUI')){ const gras2=vals.gras??w.gras; if(gras2!=null){ vals.muscle=poids2*(1-gras2/100)-bone; derivedMuscle=true; } }
  if(['muscle','ffmi','PUI'].includes(changed)&&vals.muscle!=null&&isAuto('gras')&&isAuto('fatkg')&&isAuto('lean')&&isAuto('ffmiStd')&&isAuto('SEC')){ vals.gras=Math.max(3,(poids2-vals.muscle-bone)/poids2*100); derivedGras=true; }
  // pesée cible reconstruite
  const w2=JSON.parse(JSON.stringify(w));
  for(const k of ['poids','gras','muscle','eau','visc','bmr','os','ageMeta']) if(vals[k]!=null) w2[k]=vals[k];
  for(const z of ['tronc','brasG','brasD','jambeG','jambeD']){ if(vals['m_'+z]!=null){w2.segM=w2.segM||{};w2.segM[z]=vals['m_'+z];} if(vals['g_'+z]!=null){w2.segG=w2.segG||{};w2.segG[z]=vals['g_'+z];} }
  for(const [k] of MENS) if(vals['t_'+k]!=null){w2.mens=w2.mens||{};w2.mens[k]=vals['t_'+k];}
  for(const [k] of EGYM) if(vals['e_'+k]!=null){w2.egym=w2.egym||{};w2.egym[k]=vals['e_'+k];}
  // on met à jour : les jumelles directes de la stat saisie, et toute cible dérivée déjà remplie
  const twins=new Set(); for(const g of GOAL_LINKS) if(g.includes(changed)) g.forEach(k=>twins.add(k)); twins.delete(changed);
  const base=['poids','gras','muscle','eau','t_taille','g_tronc'];
  for(const k of GOAL_KEYS){ if(k===changed) continue; const e=el(k); if(!e) continue;
    const filled=String(e.value).trim()!==''; const isTwin=twins.has(k); const isDerived=GOAL_DERIVED.includes(k)||(base.includes(k)&&vals[k]!=null&&vals[k]!==num(k));
    if(!(isTwin||(filled&&isDerived))) continue;
    const M=METRICS[k]; let v=base.includes(k)?vals[k]:M.get(w2,p); if(v==null||isNaN(v)) continue;
    e.value=+v.toFixed(M.d); e.classList.add('auto'); }
  // les dérivées muscle ↔ gras, et leurs jumelles, même si le champ était vide
  const put=(k)=>{const e=el(k); if(!e) return; const M=METRICS[k]; const v=base.includes(k)?vals[k]:M.get(w2,p); if(v==null||isNaN(v)) return; e.value=+v.toFixed(M.d); e.classList.add('auto');};
  if(derivedMuscle){ put('muscle'); if(el('ffmi')&&!isAuto('ffmi')) {} else put('ffmi'); }
  if(derivedGras){ for(const k of ['gras','fatkg','lean','ffmiStd']) put(k); }
}
