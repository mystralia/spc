    const g=id=>parseFloat(document.getElementById(id).value.replace(',','.'));
    const opt=id=>{const x=g(id);return isNaN(x)?null:x;};
    if(!isAdmin()){toast('Seul l’admin saisit les pesées.');return;}
    const me=profile(state.saisiePour)||profile(ME), mois=document.getElementById('mois').value;
    const tan=document.getElementById('tanita').value==='oui';
    const segOf=(pre)=>{const o={tronc:opt(pre+'_tronc'),brasG:opt(pre+'_brasG'),brasD:opt(pre+'_brasD'),jambeG:opt(pre+'_jambeG'),jambeD:opt(pre+'_jambeD')};return Object.values(o).every(x=>x!=null)?o:null;};
    const mens={};for(const [k] of MENS){const x=opt('t_'+k);if(x!=null)mens[k]=x;}
    const wi={id:me.id+'-'+mois,profileId:me.id,mois,poids:g('poids'),gras:tan?opt('gras'):null,muscle:tan?opt('muscle'):null,os:tan?opt('os'):null,eau:tan?opt('eau'):null,visc:tan?opt('visc'):null,bmr:tan?opt('bmr'):null,ageMeta:tan?opt('ageMeta'):null,
      segM:tan?segOf('m'):null, segG:tan?segOf('g'):null, mens:Object.keys(mens).length?mens:null};
    const eg={};for(const [k] of EGYM){const x=opt('eg_'+k);if(x!=null)eg[k]=x;} wi.egym=Object.keys(eg).length?eg:null;
    const pf={};for(const ex of PERF){const el=document.getElementById('pf_'+ex.key); const x=el?parsePerf(ex,el.value):null; if(x!=null&&x>0) pf[ex.key]=x;} wi.perf=Object.keys(pf).length?pf:null;
    const oldWi=weighinsRaw(me.id).find(x=>x.mois===mois);
    if(oldWi&&oldWi.goalsResult) wi.goalsResult=oldWi.goalsResult; // modification d'une pesée : on garde l'évaluation d'origine
    else if(me.goalsLocked&&Object.keys(me.goals||{}).length){ const r=evalGoals(me,me.goals,wi); wi.goalsResult={set:Object.assign({},me.goals),total:r.total,reached:r.reached}; me.goals={}; me.goalsLocked=false; }
    const old=weighinsRaw(me.id).find(x=>x.mois===mois); const ph=Object.assign({},old&&old.photos||{},pendingPhotos); wi.photos=Object.keys(ph).length?ph:null; pendingPhotos={};
    if(isNaN(wi.poids)||wi.poids<30){document.getElementById('f-err').textContent='Le poids est obligatoire.';return;}
    if(tan&&(wi.gras==null||wi.muscle==null)){document.getElementById('f-err').textContent='Pour une pesée Tanita, il faut au moins la masse grasse et la masse musculaire.';return;}
    if(wi.gras!=null&&wi.gras>60){document.getElementById('f-err').textContent='Vérifie le pourcentage de gras, la valeur semble hors limites.';return;}
    const prev=weighinsRaw(me.id).filter(x=>x.mois<mois).slice(-1)[0]||null;
    state.badgesBefore=badgesOf(me).filter(b=>b.ok).map(b=>b.id); state.rankBefore=rankOf(me.id); wi.pre={badges:state.badgesBefore,rank:state.rankBefore};
    DB.weighins=DB.weighins.filter(x=>x.id!==wi.id); DB.weighins.push(wi); Store.save(DB); syncBadgeLog();
    state.saisieMois=null;
    const today=isoDay(new Date()); const wasDispo=(DB.pesee.date&&dispoOf(me.id,DB.pesee.date)==='ok')||(DB.pesee.lastDate===today&&DB.pesee.lastDispos&&(DB.pesee.lastDispos[me.id]||{})[today]==='ok');
    if(wasDispo){ me.flags=Object.assign({},me.flags||{},{present:true}); }
    if(DB.pesee.date&&DB.pesee.date<=today){ for(const q of DB.profiles){ if(answered(q.id)){ q.dispoLog=(q.dispoLog||[]); if(!q.dispoLog.includes(mois)) q.dispoLog.push(mois); } } DB.pesee={date:null,dispos:{},lastDispos:DB.pesee.dispos,lastDate:DB.pesee.date,heure:DB.pesee.heure,revealAt:DB.pesee.revealAt,revealMois:DB.pesee.revealMois,forceOpen:DB.pesee.forceOpen};Store.save(DB);}
    else if(!DB.pesee.lastDate||DB.pesee.lastDate<isoDay(new Date())){ DB.pesee.lastDate=isoDay(new Date()); Store.save(DB); } // pesée saisie sans date fixée : on prend aujourd'hui
    if(sealed()===mois){ state.screen='saisie'; state.saisiePour=null; render(); toast('Pesée enregistrée, sous enveloppe jusqu’à '+(DB.pesee.heure||'20:00').replace(':',' h ')+'.'); }
    else if(wi.gras!=null&&wi.muscle!=null&&!old) reveal(me, prev, wi); else { state.screen='carte'; state.profileId=me.id; render(); toast('Pesée enregistrée.'); }
  }
  if(e.target.id==='loginf'){ const em=document.getElementById('lg-email').value.trim(), pw=document.getElementById('lg-pass').value; cloudStatus(null); cloudLogin(em,pw).then(err=>{ if(err) cloudStatus(/invalid/i.test(err)?'E-mail ou mot de passe incorrect.':err); }); return; }
  if(e.target.id==='npf'){ cloudPassword(document.getElementById('np1').value,document.getElementById('np2').value).then(err=>{ if(err){ cloudStatus(err); return; } state.screen=ME?'profil':'potes'; render(); toast('Mot de passe enregistré.'); }); return; }
  if(e.target.id==='pf'){
    const v=id=>document.getElementById(id).value.trim();
    if(!CLOUD.on&&!/^[0-9]{4}$/.test(v('pin2'))){toast('Le code doit faire 4 chiffres.');return;}
    const cur=ME?profile(ME):null; const goals=cur?(cur.goals||{}):{};
    const data={prenom:v('prenom'),naissance:v('naissance'),sexe:v('sexe'),taille:parseInt(v('taille'),10),objectif:v('objectif'),goals,photosPrivees:document.getElementById('photosPrivees').checked}; if(!CLOUD.on) data.pin=v('pin2');
    if(ME){Object.assign(profile(ME),data);}else{const id='p'+Date.now();DB.profiles.push({id,...data});ME=id;try{localStorage.setItem('stats-corpo-me',id);}catch(e){}}
    Store.save(DB); state.screen='carte'; state.profileId=ME; render(); toast('Profil enregistré.');
  }
});
render();
if(CLOUD.on) cloudInit();
setInterval(()=>{const el=document.getElementById('cd'); if(el){const c=countdownText(); if(c) el.textContent=c.txt;}},30000);
</script>
</body>
</html>
